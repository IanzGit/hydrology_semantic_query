views:
  - name: view_his_point_except
    title: 水文监测历史异常
    description: 查询水文监测点的预警、报警、断电和异常区间，每行代表一条异常事实。
    public: true
    meta:
      ai_context: >-
        报警记录、报警信息、异常记录、断电记录、异常区间、异常持续时长和异常期间极值问题使用该 View。数据源已固定 SubSysId=1025。异常起止时间必须使用 started_at和ended_at，它们对应真实字段STime和ETime；不得使用不存在的StTime，也不得用updated_at代替。该 View 不过滤点位删除时间，只有明确要求当前有效点位时才过滤 point_active_state=1。
      business_domain: hydrology_monitor
      aliases:
        - 水文报警记录
        - 水文异常记录
        - 水文断电记录
      use_cases:
        - 查询报警、异常和断电区间
        - 查询异常期间极值、均值和发生时间
      default_projection:
        - point_code
        - point_name
        - value_type_name
        - discrete_status_text
        - started_at
        - ended_at
        - maximum_value
        - maximum_at
    cubes:
      - join_path: base_his_point_except
        includes:
          - exception_id
          - point_id
          - started_at
          - ended_at
          - discrete_status_text
          - maximum_value
          - maximum_at
          - minimum_value
          - minimum_at
          - average_value
          - value_status_id
          - device_status_id
          - exception_count
          - highest_exception_value
          - lowest_exception_value
          - average_exception_value
      - join_path: base_his_point_except.base_point_info
        includes:
          - name: code
            alias: point_code
          - name: name
            alias: point_name
          - address_id
          - value_type_id
          - name: unit
            alias: point_unit
          - device_id
          - name: active_state
            alias: point_active_state
      - join_path: base_his_point_except.base_point_info.base_device_info
        includes:
          - name: name
            alias: device_name
          - name: code
            alias: device_code
      - join_path: base_his_point_except.base_point_info.base_m_value_type_sys
        includes:
          - name: name
            alias: value_type_name

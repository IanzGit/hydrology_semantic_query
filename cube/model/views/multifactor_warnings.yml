views:
  - name: hydrology_multifactor_warnings
    title: 水文多因素预警情况
    description: 查询已启用多因素预警配置对应的已启用预警事件，每行代表一条多因素预警事件。
    public: true
    meta:
      ai_context: 多因素预警事件、预警等级、预警值、开始时间和关联配置问题使用该 View。source_type 固定为3，且预警事件和预警配置均固定为启用状态；启用配置清单和配置指标明细不属于该 View。
      business_domain: hydrology
      aliases:
        - 多因素预警
        - 水害预警
      use_cases:
        - 查询启用配置产生的多因素预警事件
        - 统计多因素预警事件数量
      priority: 1.0
    cubes:
      - join_path: base_warn_state_info
        includes:
          - name: id
            alias: warning_event_id
          - name: source_id
            alias: configuration_id
          - source_type
          - name: name
            alias: warning_name
          - name: current_value
            alias: warning_value
          - current_level
          - highest_level
          - started_at
          - name: place
            alias: warning_place
          - station_name
          - name: is_enabled
            alias: warning_is_enabled
          - name: alarm_count
            alias: warning_event_count
            title: 多因素预警事件数
            description: 满足多因素来源及事件、配置启用条件的预警事件数量。
      - join_path: base_warn_state_info.base_water_warn_sensor_set
        includes:
          - name: name
            alias: configuration_name
          - is_custom
          - name: category
            alias: configuration_category
          - name: place
            alias: configuration_place
          - risk_level
          - name: current_value
            alias: configuration_current_value
          - name: value_updated_at
            alias: configuration_value_updated_at
          - warning_source_data
          - strategy_type
          - warning_value_categories
          - unit
          - name: is_enabled
            alias: configuration_is_enabled
    access_policy:
      - role: "*"
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: source_type
              operator: equals
              values:
                - "3"
            - member: warning_is_enabled
              operator: equals
              values:
                - "1"
            - member: configuration_is_enabled
              operator: equals
              values:
                - "1"

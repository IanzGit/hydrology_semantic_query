cubes:
  - name: base_label
    sql_table: label
    title: 水文监测标签
    description: 监测标签及其层级字段的基础实体。
    meta:
      business_domain: hydrology
      ai_context: |-
        base_label.name 表示标签名称，base_label.tree_code 表示标签树编码。
        tree_code 每5位表示一级，删除末5位得到直接父节点编码。
        查询精确节点时使用 base_label.tree_code equals；查询某个分支及全部后代时使用 base_label.tree_code startsWith。
        相同标签名称可能存在于多个分支；用户给出上级或完整路径时，必须按路径选择 tree_code，不得仅按名称猜测。

        标签树，格式为“标签名称 [treeCode]”：
        - 按空间位置划分 [00001]
          - 地面 [0000100001]
            - 地面气象 [000010000100001]
              - 大气压 [00001000010000100001]
              - 温度 [00001000010000100002]
              - 湿度 [00001000010000100003]
              - 降雨量 [00001000010000100004]
              - 风速 [00001000010000100005]
              - 风向 [00001000010000100006]
            - 河流沟谷 [000010000100002]
              - 水位 [00001000010000200001]
              - 流速 [00001000010000200002]
              - 流量 [00001000010000200003]
            - 老窑井口 [000010000100003]
              - 水位 [00001000010000300001]
            - 长观孔 [000010000100004]
              - 温度 [00001000010000400001]
              - 水位 [00001000010000400002]
          - 井下 [0000100002]
            - 采空区密闭 [000010000200001]
              - 流量 [00001000020000100001]
              - 水压 [00001000020000100002]
              - 水位 [00001000020000100003]
            - 工作面涌水量 [000010000200002]
              - 流量 [00001000020000200001]
            - 水仓 [000010000200003]
              - 液位 [00001000020000300001]
              - 温度 [00001000020000300002]
              - 水质 [00001000020000300003]
            - 疏放水钻孔 [000010000200004]
              - 流量 [00001000020000400001]
              - 压力 [00001000020000400002]
            - 水泵房 [000010000200005]
              - 水泵 [00001000020000500001]
              - 液位 [00001000020000500002]
              - 流量 [00001000020000500003]
        - 按传感器形态划分 [00002]
          - 真实 [0000200001]
          - 虚拟 [0000200002]
        - 按数据来源划分 [00003]
          - KJ420水文监测系统 [0000300001]
          - 水文监测系统 [0000300002]
          - 采空区水位系统 [0000300003]
          - 人员定位系统 [0000300004]
          - 排水系统 [0000300005]
          - 探放水系统 [0000300006]
        - 单因素 [00004]
          - 涌水量预警 [0000400001]
          - 采空区密闭预警 [0000400002]
          - 河流沟谷预警 [0000400003]
          - 降雨量预警 [0000400004]
          - 长观孔预警 [0000400005]
          - 空间距离预警 [0000400006]
          - 排水量预警 [0000400007]
        - 多因素 [00005]
          - 地表水害红石墕沟预警模型 [0000500001]
          - 地表开峁沟水害预警模型 [0000500002]
          - 地表白石岩沟水害预警模型 [0000500003]
          - 地表火赖沟水害预警模型 [0000500004]
          - 同层老空水害预警模型 [0000500005]
        - 按点位划分 [00006]
          - 上传多因素 [0000600001]
          - 上传单因素 [0000600002]
        - 按设备类型分 [00007]
          - KJ420 [0000700001]
            - 河流沟谷 [000070000100001]
            - 长观孔 [000070000100002]
            - 气象站 [000070000100003]
            - 流量 [000070000100004]
            - 水压/水位 [000070000100005]
            - 在线水质 [000070000100006]
          - 其他系统 [0000700002]
            - 排水系统 [000070000200001]
            - 采空区水位系统 [000070000200002]
            - 长观孔系统 [000070000200003]
            - 透明地质系统 [000070000200004]
            - 数据中台 [000070000200005]
            - 人员定位系统 [000070000200006]
        - 按安装区域分 [00008]
          - 地表设备 [0000800001]
            - 气象站 [000080000100001]
            - 河流沟谷 [000080000100002]
            - 含水层 [000080000100003]
          - 井下设备 [0000800002]
            - 四盘区 [000080000200001]
              - 45207综采工作面 [00008000020000100001]
              - 45208综采工作面 [00008000020000100002]
              - 措施井底水泵房 [00008000020000100003]
              - 六联巷水泵房 [00008000020000100004]
            - 八盘区 [000080000200002]
              - 85211综采工作面 [00008000020000200001]
              - 85211综掘工作面 [00008000020000200002]
              - 八盘区中央水泵房 [00008000020000200003]
              - 八盘区中转水泵房 [00008000020000200004]
              - 八盘区复用水泵房 [00008000020000200005]
              - 采空区密闭 [00008000020000200006]
            - 井口 [000080000200003]
      use_cases:
        - 查询完整标签目录和标签层级
        - 查询不同分类标签下的传感器
    joins:
      - name: role_label_parent
        relationship: many_to_one
        sql: "{CUBE}.parentId = {role_label_parent.id}"
    measures:
      - name: label_count
        type: count
        title: 标签数
        description: 标签记录数量。
    dimensions:
      - name: id
        sql: "{CUBE}.`labelId`"
        type: string
        primary_key: true
        public: true
        title: 标签ID
        description: 标签唯一标识。
      - name: parent_id
        sql: "{CUBE}.`parentId`"
        type: string
        title: 父标签ID
        description: 当前标签直接父级的唯一标识；根标签为空。
      - name: tree_code
        sql: "{CUBE}.`treeCode`"
        type: string
        title: 标签树编码
        description: 标签在目录树中的编码。
      - name: name
        sql: "{CUBE}.`labelName`"
        type: string
        title: 标签名称
        description: 标签名称。
      - name: type
        sql: "{CUBE}.`labelType`"
        type: string
        title: 标签类型
        description: 标签配置的类型。
      - name: notes
        sql: "{CUBE}.`labelNote`"
        type: string
        title: 标签备注
        description: 标签备注信息。
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: boolean
        title: 标签是否启用
        description: 标签配置的启用状态。
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: 创建时间
        description: 标签创建时间。
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        title: 创建人ID
        description: 创建标签的用户标识。
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: 更新时间
        description: 标签最近更新时间。
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        title: 更新人ID
        description: 最近更新标签的用户标识。
    segments:
      - name: enabled
        sql: "{CUBE}.isEnable = 1"
        title: 已启用标签
        description: 仅保留已启用的标签。

  - name: role_label_parent
    sql_table: label
    title: 内部父标签角色
    description: label 表在父标签关系中的只读角色，仅用于返回直接父标签属性。
    dimensions:
      - name: id
        sql: "{CUBE}.`labelId`"
        type: string
        primary_key: true
        public: true
        title: 父标签ID
        description: 父标签唯一标识。
      - name: name
        sql: "{CUBE}.`labelName`"
        type: string
        title: 父标签名称
        description: 父标签名称。
      - name: tree_code
        sql: "{CUBE}.`treeCode`"
        type: string
        title: 父标签树编码
        description: 父标签在目录树中的编码。

cubes:
  - name: base_device_x_webapi
    sql_table: device_x_webapi
    title: "传感器-webapi接收方式配置"
    description: "device_x_webapi 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 传感器-webapi接收方式配置 的基础记录和字段"
    measures:
      - name: device_x_webapi_count
        type: count
        title: "传感器-webapi接收方式配置记录数"
        description: "device_x_webapi 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        title: "id"
        description: "数据库字段 id，物理类型为 varchar。"
      - name: sensor_id
        sql: "{CUBE}.`sensorId`"
        type: string
        title: "传感器id"
        description: "传感器id。"
      - name: ip_address
        sql: "{CUBE}.`ipAddress`"
        type: string
        title: "ip地址"
        description: "ip地址。"
      - name: port
        sql: "{CUBE}.`port`"
        type: number
        title: "端口"
        description: "端口。"
      - name: function_path
        sql: "{CUBE}.`functionPath`"
        type: string
        public: false
        title: "功能路径"
        description: "功能路径。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createTime`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: updated_at
        sql: "{CUBE}.`updateTime`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"

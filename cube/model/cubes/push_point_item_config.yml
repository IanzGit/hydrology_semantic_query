cubes:
  - name: base_push_point_item_config
    sql_table: push_point_item_config
    public: true
    description: "push_point_item_config 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "push_point_item_config"
      business_domain: hydrology
      aliases:
        - "push_point_item_config"
        - "推送点位数据项"
      use_cases:
        - "查询 推送点位数据项 的基础记录和字段"
      priority: 0.2
    measures:
      - name: push_point_item_config_count
        type: count
        description: "push_point_item_config 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: item_id
        sql: "{CUBE}.`itemId`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 itemId，物理类型为 varchar。"
      - name: point_id
        sql: "{CUBE}.`pointId`"
        type: string
        description: "点位id。"
      - name: config_id
        sql: "{CUBE}.`configId`"
        type: string
        description: "配置id。"
      - name: sequence
        sql: "{CUBE}.`seq`"
        type: number
        description: "序号。"
      - name: item_name
        sql: "{CUBE}.`itemName`"
        type: string
        description: "配置项名称。"
      - name: value_name
        sql: "{CUBE}.`valueName`"
        type: string
        description: "值名称。"
      - name: value_type
        sql: "{CUBE}.`valueType`"
        type: string
        description: "值类型。"
      - name: source_type
        sql: "{CUBE}.`sourceType`"
        type: string
        description: "来源类型。"
      - name: value_length
        sql: "{CUBE}.`valueLength`"
        type: number
        description: "数据长度。"
      - name: item_value
        sql: "{CUBE}.`itemValue`"
        type: string
        description: "配置值。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

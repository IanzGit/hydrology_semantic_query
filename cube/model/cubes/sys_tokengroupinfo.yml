cubes:
  - name: base_sys_tokengroupinfo
    sql_table: sys_tokengroupinfo
    public: true
    description: "sys_tokengroupinfo 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "sys_tokengroupinfo"
      business_domain: hydrology
      aliases:
        - "sys_tokengroupinfo"
      use_cases:
        - "查询 sys_tokengroupinfo 的基础记录和字段"
      priority: 0.2
    measures:
      - name: sys_tokengroupinfo_count
        type: count
        description: "sys_tokengroupinfo 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: group_id
        sql: "{CUBE}.`groupId`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 groupId，物理类型为 varchar。"
      - name: group_name
        sql: "{CUBE}.`groupName`"
        type: string
        description: "数据库字段 groupName，物理类型为 varchar。"

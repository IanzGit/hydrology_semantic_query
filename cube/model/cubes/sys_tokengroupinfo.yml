        public: true
        title: "groupId"
        description: "数据库字段 groupId，物理类型为 varchar。"
      - name: group_name
        sql: "{CUBE}.`groupName`"
        type: string
        title: "groupName"
        description: "数据库字段 groupName，物理类型为 varchar。"

cubes:
  - name: base_device_x_analysis_calculation
    sql_table: device_x_analysis_calculation
    public: true
    description: "device_x_analysis_calculation 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "device_x_analysis_calculation"
      business_domain: hydrology
      aliases:
        - "device_x_analysis_calculation"
        - "变量计算类型"
      use_cases:
        - "查询 变量计算类型 的基础记录和字段"
      priority: 0.2
    measures:
      - name: device_x_analysis_calculation_count
        type: count
        description: "device_x_analysis_calculation 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: calculation_type
        sql: "{CUBE}.`calculationType`"
        type: string
        primary_key: true
        public: true
        description: "计算类型。"
      - name: calculation_name
        sql: "{CUBE}.`calculationName`"
        type: string
        description: "计算类型名称。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

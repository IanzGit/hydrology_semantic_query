        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: login_type
        sql: "{CUBE}.`loginType`"
        type: string
        title: "loginType"
        description: "数据库字段 loginType，物理类型为 varchar。"
      - name: user_id
        sql: "{CUBE}.`userId`"
        type: string
        title: "userId"
        description: "数据库字段 userId，物理类型为 varchar。"
      - name: login_ip
        sql: "{CUBE}.`loginIp`"
        type: string
        title: "loginIp"
        description: "数据库字段 loginIp，物理类型为 varchar。"
      - name: source
        sql: "{CUBE}.`source`"
        type: string
        title: "source"
        description: "数据库字段 source，物理类型为 varchar。"

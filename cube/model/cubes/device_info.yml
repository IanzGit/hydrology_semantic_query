cubes:
  - name: base_device_info
    sql_table: device_info
    public: true
    description: 设备配置与设备当前状态的基础实体。
    meta:
      business_domain: hydrology
      aliases:
        - 水文设备
        - 监测设备
      use_cases:
        - 查询设备配置、位置和状态
        - 按设备类别、分站或交换机筛选设备
      priority: 0.7
    measures:
      - name: device_count
        type: count
        description: 设备记录数量。
    dimensions:
      - name: id
        sql: id
        type: string
        primary_key: true
        public: true
        description: 设备唯一标识。
      - name: name
        sql: deviceName
        type: string
        description: 设备业务名称。
      - name: code
        sql: deviceCode
        type: string
        description: 设备业务编码。
      - name: svg_position
        sql: deviceSvgPosition
        type: string
        public: false
        description: 设备在图形中的位置配置。
      - name: type_id
        sql: belongTypeId
        type: string
        description: 设备所属类别唯一标识。
      - name: type_name
        sql: belongTypeName
        type: string
        description: 设备所属类别名称。
      - name: station_id
        sql: belongStationId
        type: string
        description: 设备所属分站唯一标识。
      - name: station_name
        sql: belongStationName
        type: string
        description: 设备所属分站名称。
      - name: switch_id
        sql: belongSwitchId
        type: string
        description: 设备所属交换机唯一标识。
      - name: switch_name
        sql: belongSwitchName
        type: string
        description: 设备所属交换机名称。
      - name: place
        sql: place
        type: string
        description: 设备安装位置。
      - name: install_area
        sql: installArea
        type: string
        description: 设备配置的采集类型。
      - name: port
        sql: PORT
        type: number
        public: false
        description: 设备配置的端口号，仅作为属性使用。
      - name: state
        sql: state
        type: string
        description: 设备当前状态。
      - name: state_updated_at
        sql: stateUpdateTime
        type: time
        description: 设备状态最近一次改变的时间。
      - name: is_enabled
        sql: isEnable
        type: boolean
        description: 设备配置的启用状态。
        meta:
          projection_role: filter_only
    segments:
      - name: enabled
        sql: "{CUBE}.isEnable = 1"
        description: 仅保留已启用的设备。

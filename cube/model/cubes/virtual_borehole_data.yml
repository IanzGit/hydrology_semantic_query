cubes:
  - name: base_virtual_borehole_data
    sql_table: virtual_borehole_data
    public: true
    description: "virtual_borehole_data 表的基础记录；一行对应一条物理记录，数据库未声明主键，因此不参与 Cube Join。"
    meta:
      source_table: "virtual_borehole_data"
      business_domain: hydrology
      aliases:
        - "virtual_borehole_data"
        - "虚拟钻孔数据表"
      use_cases:
        - "查询 虚拟钻孔数据表 的基础记录和字段"
      priority: 0.2
    measures:
      - name: virtual_borehole_data_count
        type: count
        description: "virtual_borehole_data 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        description: "数据库字段 id，物理类型为 varchar。"
      - name: point_code
        sql: "{CUBE}.`point_code`"
        type: string
        description: "编号。"
      - name: point_x
        sql: "{CUBE}.`point_x`"
        type: number
        description: "X坐标。"
      - name: point_y
        sql: "{CUBE}.`point_y`"
        type: number
        description: "Y坐标。"
      - name: coal_thickness
        sql: "{CUBE}.`coal_thickness`"
        type: number
        description: "煤层厚度(m)。"
      - name: aquiclude_thickness
        sql: "{CUBE}.`aquiclude_thickness`"
        type: number
        description: "隔水层厚度(m)。"
      - name: lithology
        sql: "{CUBE}.`lithology`"
        type: string
        description: "岩性。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

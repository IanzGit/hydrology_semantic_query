cubes:
  - name: base_device_x_analysis
    sql_table: device_x_analysis
    public: true
    description: "device_x_analysis 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "device_x_analysis"
      business_domain: hydrology
      aliases:
        - "device_x_analysis"
      use_cases:
        - "查询 device_x_analysis 的基础记录和字段"
      priority: 0.2
    measures:
      - name: device_x_analysis_count
        type: count
        description: "device_x_analysis 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 id，物理类型为 varchar。"
      - name: analysis_name
        sql: "{CUBE}.`analysisName`"
        type: string
        description: "数据库字段 analysisName，物理类型为 varchar。"
      - name: analysis_file
        sql: "{CUBE}.`analysisFile`"
        type: string
        description: "数据库字段 analysisFile，物理类型为 varchar。"
      - name: analysis_file_base64
        sql: "{CUBE}.`analysisFileBase64`"
        type: string
        description: "数据库字段 analysisFileBase64，物理类型为 text。"
      - name: created_by_id
        sql: "{CUBE}.`createUser`"
        type: string
        description: "创建记录的用户。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUser`"
        type: string
        description: "最近更新记录的用户。"
      - name: created_at
        sql: "{CUBE}.`createTime`"
        type: time
        description: "记录创建时间。"
      - name: updated_at
        sql: "{CUBE}.`updateTime`"
        type: time
        description: "记录最近更新时间。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: test_content
        sql: "{CUBE}.`testContent`"
        type: string
        description: "测试内容。"
      - name: type
        sql: "{CUBE}.`TYPE`"
        type: number
        description: "脚本类别，1解析，2数据发送组装脚本，3多因素聚合脚本。"
      - name: notes
        sql: "{CUBE}.`remarks`"
        type: string
        description: "脚本说明。"

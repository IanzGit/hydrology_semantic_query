cubes:
  - name: base_colliery_basic
    sql_table: colliery_basic
    title: "煤矿基本信息-基本情况"
    description: "colliery_basic 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 煤矿基本信息-基本情况 的基础记录和字段"
    measures:
      - name: colliery_basic_count
        type: count
        title: "煤矿基本信息-基本情况记录数"
        description: "colliery_basic 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        title: "id"
        description: "数据库字段 id，物理类型为 varchar。"
      - name: colliery_name
        sql: "{CUBE}.`collieryName`"
        type: string
        title: "证载矿名"
        description: "证载矿名。"
      - name: colliery_type
        sql: "{CUBE}.`collieryType`"
        type: string
        title: "煤矿类型"
        description: "煤矿类型。"
      - name: province
        sql: "{CUBE}.`province`"
        type: string
        title: "所在省"
        description: "所在省。"
      - name: city
        sql: "{CUBE}.`city`"
        type: string
        title: "所在市"
        description: "所在市。"
      - name: county
        sql: "{CUBE}.`county`"
        type: string
        title: "所在区县"
        description: "所在区县。"
      - name: safe_grade
        sql: "{CUBE}.`safeGrade`"
        type: string
        title: "安全生产标准评级"
        description: "安全生产标准评级。"
      - name: safe_grade_time
        sql: "{CUBE}.`safeGradeTime`"
        type: time
        title: "安全生产标准定级日期"
        description: "安全生产标准定级日期。"
      - name: mine_area
        sql: "{CUBE}.`mineArea`"
        type: number
        title: "井田面积"
        description: "井田面积。"
      - name: production_capacity
        sql: "{CUBE}.`productionCapacity`"
        type: number
        title: "核定生产能力"
        description: "核定生产能力。"
      - name: approved_mining
        sql: "{CUBE}.`approvedMining`"
        type: string
        title: "批准开采煤层"
        description: "批准开采煤层。"
      - name: mining_coal_seams
        sql: "{CUBE}.`miningCoalSeams`"
        type: string
        title: "现开采煤层"
        description: "现开采煤层。"
      - name: coal_type
        sql: "{CUBE}.`coalType`"
        type: string
        title: "煤种"
        description: "煤种。"
      - name: mining_depth_range
        sql: "{CUBE}.`miningDepthRange`"
        type: string
        title: "现开采深度范围"
        description: "现开采深度范围。"
      - name: remain_service_life
        sql: "{CUBE}.`remainServiceLife`"
        type: number
        title: "剩余服务年限"
        description: "剩余服务年限。"
      - name: water_inflow_normal
        sql: "{CUBE}.`waterInflowNormal`"
        type: number
        title: "矿井涌水量-正常"
        description: "矿井涌水量-正常。"
      - name: water_inflow_max
        sql: "{CUBE}.`waterInflowMax`"
        type: number
        title: "矿井涌水量-最大"
        description: "矿井涌水量-最大。"
      - name: main_flood_type
        sql: "{CUBE}.`mainFloodType`"
        type: string
        title: "主要水患类型"
        description: "主要水患类型。"
      - name: hydrogeological_type_level
        sql: "{CUBE}.`hydrogeologicalTypeLevel`"
        type: string
        title: "水文地质类型等级"
        description: "水文地质类型等级。"
      - name: geological_type_level
        sql: "{CUBE}.`geologicalTypeLevel`"
        type: string
        title: "地质类型等级"
        description: "地质类型等级。"
      - name: current_mining_area
        sql: "{CUBE}.`currentMiningArea`"
        type: string
        title: "现开采采区"
        description: "现开采采区。"
      - name: drainage_capacity
        sql: "{CUBE}.`drainageCapacity`"
        type: string
        title: "排水能力"
        description: "排水能力。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"
      - name: validity_start_time
        sql: "{CUBE}.`validityStartTime`"
        type: time
        title: "有效期限开始时间"
        description: "有效期限开始时间。"
      - name: validity_stop_time
        sql: "{CUBE}.`validityStopTime`"
        type: time
        title: "有效期限结束时间"
        description: "有效期限结束时间。"
      - name: license_number
        sql: "{CUBE}.`licenseNumber`"
        type: string
        title: "采矿证号"
        description: "采矿证号。"

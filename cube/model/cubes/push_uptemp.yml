cubes:
  - name: base_push_uptemp
    sql_table: push_uptemp
    public: true
    description: "push_uptemp 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "push_uptemp"
      business_domain: hydrology
      aliases:
        - "push_uptemp"
        - "数据推送上传模板"
      use_cases:
        - "查询 数据推送上传模板 的基础记录和字段"
      priority: 0.2
    measures:
      - name: push_uptemp_count
        type: count
        description: "push_uptemp 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: temp_id
        sql: "{CUBE}.`tempId`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 tempId，物理类型为 varchar。"
      - name: temp_name
        sql: "{CUBE}.`tempName`"
        type: string
        description: "模板名称。"
      - name: temp_file_id
        sql: "{CUBE}.`tempFileId`"
        type: string
        description: "模板fileId。"
      - name: notes
        sql: "{CUBE}.`remark`"
        type: string
        description: "备注。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

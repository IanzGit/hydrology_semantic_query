        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 id，物理类型为 varchar。"
      - name: name
        sql: "{CUBE}.`name`"
        type: string
        description: "名称。"
      - name: file_path
        sql: "{CUBE}.`filePath`"
        type: string
        public: false
        description: "文件路径。"
      - name: detect_person
        sql: "{CUBE}.`detectPerson`"
        type: string
        description: "探测人。"
      - name: detect_address
        sql: "{CUBE}.`detectAddress`"
        type: string
        description: "探测地点。"
      - name: detect_time
        sql: "{CUBE}.`detectTime`"
        type: time
        description: "探测时间。"
      - name: image_base64
        sql: "{CUBE}.`imageBase64`"
        type: string
        description: "图片base64。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"

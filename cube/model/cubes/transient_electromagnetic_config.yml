        description: "最近更新记录的用户标识。"
      - name: direction
        sql: "{CUBE}.`direction`"
        type: string
        description: "方向。"
      - name: angle
        sql: "{CUBE}.`angle`"
        type: string
        description: "角度。"
      - name: distance

        - "查询 在线瞬变配置 的基础记录和字段"
      priority: 0.2
    measures:
      - name: transient_electromagnetic_config_count
        type: count
        description: "transient_electromagnetic_config 表物理记录数量，不施加默认过滤。"
    dimensions:

cubes:
  - name: base_situation_history
    sql_table: situation_history
    title: "水害态势计算历史表"
    description: "situation_history 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 水害态势计算历史表 的基础记录和字段"
    measures:
      - name: situation_history_count
        type: count
        title: "水害态势计算历史表记录数"
        description: "situation_history 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: history_id
        sql: "{CUBE}.`historyId`"
        type: string
        primary_key: true
        public: true
        title: "historyId"
        description: "数据库字段 historyId，物理类型为 varchar。"
      - name: situation_id
        sql: "{CUBE}.`situationId`"
        type: string
        title: "水害态势id"
        description: "水害态势id。"
      - name: score
        sql: "{CUBE}.`score`"
        type: number
        title: "分值"
        description: "分值。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"

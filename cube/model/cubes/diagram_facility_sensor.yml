cubes:
  - name: base_diagram_facility_sensor
    sql_table: diagram_facility_sensor
    public: true
    description: "diagram_facility_sensor 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "diagram_facility_sensor"
      business_domain: hydrology
      aliases:
        - "diagram_facility_sensor"
        - "组态图泵房设施传感器配置"
      use_cases:
        - "查询 组态图泵房设施传感器配置 的基础记录和字段"
      priority: 0.2
    measures:
      - name: diagram_facility_sensor_count
        type: count
        description: "diagram_facility_sensor 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 id，物理类型为 varchar。"
      - name: facility_id
        sql: "{CUBE}.`facilityId`"
        type: string
        description: "所属设施id。"
      - name: sensor_id
        sql: "{CUBE}.`sensorId`"
        type: string
        description: "传感器id。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

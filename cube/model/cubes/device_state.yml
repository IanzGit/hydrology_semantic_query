cubes:
  - name: base_device_state
    sql_table: device_state
    title: "device_state"
    description: "device_state 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 device_state 的基础记录和字段"
    measures:
      - name: device_state_count
        type: count
        title: "device_state记录数"
        description: "device_state 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: device_id
        sql: "{CUBE}.`deviceId`"
        type: string
        primary_key: true
        public: true
        title: "设备id"
        description: "设备id。"
      - name: threshold
        sql: "{CUBE}.`threshold`"
        type: string
        title: "当前阈值"
        description: "当前阈值。"
      - name: state
        sql: "{CUBE}.`state`"
        type: string
        title: "正常或报警"
        description: "正常或报警。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"

cubes:
  - name: base_device_state
    sql_table: device_state
    public: true
    description: "device_state 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "device_state"
      business_domain: hydrology
      aliases:
        - "device_state"
      use_cases:
        - "查询 device_state 的基础记录和字段"
      priority: 0.2
    measures:
      - name: device_state_count
        type: count
        description: "device_state 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: device_id
        sql: "{CUBE}.`deviceId`"
        type: string
        primary_key: true
        public: true
        description: "设备id。"
      - name: threshold
        sql: "{CUBE}.`threshold`"
        type: string
        description: "当前阈值。"
      - name: state
        sql: "{CUBE}.`state`"
        type: string
        description: "正常或报警。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

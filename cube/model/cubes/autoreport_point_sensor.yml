cubes:
  - name: base_autoreport_point_sensor
    sql_table: autoreport_point_sensor
    public: true
    description: "autoreport_point_sensor 表的基础记录；一行对应一条物理记录，数据库未声明主键，因此不参与 Cube Join。"
    meta:
      source_table: "autoreport_point_sensor"
      business_domain: hydrology
      aliases:
        - "autoreport_point_sensor"
        - "智能分析节点设备表"
      use_cases:
        - "查询 智能分析节点设备表 的基础记录和字段"
      priority: 0.2
    measures:
      - name: autoreport_point_sensor_count
        type: count
        description: "autoreport_point_sensor 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: point_id
        sql: "{CUBE}.`pointId`"
        type: string
        description: "数据库字段 pointId，物理类型为 varchar。"
      - name: sensor_id
        sql: "{CUBE}.`sensorId`"
        type: string
        description: "数据库字段 sensorId，物理类型为 varchar。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

cubes:
  - name: base_device_x_analysis_variable
    sql_table: device_x_analysis_variable
    title: "判识变量"
    description: "device_x_analysis_variable 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 判识变量 的基础记录和字段"
    measures:
      - name: device_x_analysis_variable_count
        type: count
        title: "判识变量记录数"
        description: "device_x_analysis_variable 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        title: "id"
        description: "数据库字段 id，物理类型为 varchar。"
      - name: analysis_id
        sql: "{CUBE}.`analysisId`"
        type: string
        title: "所属脚本"
        description: "所属脚本。"
      - name: variable_name
        sql: "{CUBE}.`variableName`"
        type: string
        title: "变量名称"
        description: "变量名称。"
      - name: variable_key
        sql: "{CUBE}.`variableKey`"
        type: string
        title: "变量key"
        description: "变量key。"
      - name: variable_default
        sql: "{CUBE}.`variableDefault`"
        type: string
        title: "默认值"
        description: "默认值。"
      - name: variable_notes
        sql: "{CUBE}.`variableNotes`"
        type: string
        title: "变量说明"
        description: "变量说明。"
      - name: is_edit
        sql: "{CUBE}.`isEdit`"
        type: number
        title: "是否可修改"
        description: "是否可修改。"
      - name: frequency
        sql: "{CUBE}.`frequency`"
        type: string
        title: "频率"
        description: "频率。"
      - name: calculation_type
        sql: "{CUBE}.`calculationType`"
        type: string
        title: "计算类型"
        description: "计算类型。"
      - name: calculation_param
        sql: "{CUBE}.`calculationParam`"
        type: string
        title: "计算参数"
        description: "计算参数。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"

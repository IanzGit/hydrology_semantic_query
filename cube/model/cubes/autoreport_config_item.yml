cubes:
  - name: base_autoreport_config_item
    sql_table: autoreport_config_item
    public: true
    description: "autoreport_config_item 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "autoreport_config_item"
      business_domain: hydrology
      aliases:
        - "autoreport_config_item"
        - "智能分析配置项表"
      use_cases:
        - "查询 智能分析配置项表 的基础记录和字段"
      priority: 0.2
    measures:
      - name: autoreport_config_item_count
        type: count
        description: "autoreport_config_item 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: item_id
        sql: "{CUBE}.`itemId`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 itemId，物理类型为 varchar。"
      - name: config_id
        sql: "{CUBE}.`configId`"
        type: string
        description: "数据库字段 configId，物理类型为 varchar。"
      - name: item_name
        sql: "{CUBE}.`itemName`"
        type: string
        description: "数据项名称。"
      - name: item_key
        sql: "{CUBE}.`itemKey`"
        type: string
        description: "数据项key。"
      - name: source_type
        sql: "{CUBE}.`sourceType`"
        type: string
        description: "数据源类型。"
      - name: method_type
        sql: "{CUBE}.`methodType`"
        type: string
        description: "计算类型。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"
      - name: point_id
        sql: "{CUBE}.`pointId`"
        type: string
        description: "节点id。"

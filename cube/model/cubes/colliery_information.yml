cubes:
  - name: base_colliery_information
    sql_table: colliery_information
    public: true
    description: "colliery_information 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "colliery_information"
      business_domain: hydrology
      aliases:
        - "colliery_information"
        - "煤矿信息-资料管理"
      use_cases:
        - "查询 煤矿信息-资料管理 的基础记录和字段"
      priority: 0.2
    measures:
      - name: colliery_information_count
        type: count
        description: "colliery_information 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 id，物理类型为 varchar。"
      - name: sequence
        sql: "{CUBE}.`seq`"
        type: number
        description: "序号。"
      - name: info_name
        sql: "{CUBE}.`infoName`"
        type: string
        description: "资料名称。"
      - name: file_id
        sql: "{CUBE}.`fileId`"
        type: string
        description: "附件fileId。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

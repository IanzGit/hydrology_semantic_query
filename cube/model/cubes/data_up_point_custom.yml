cubes:
  - name: base_data_up_point_custom
    sql_table: data_up_point_custom
    title: "data_up_point_custom"
    description: "data_up_point_custom 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 data_up_point_custom 的基础记录和字段"
    joins:
      - name: base_data_up_config_custom
        relationship: many_to_one
        sql: "{CUBE}.`configId` = {base_data_up_config_custom.config_id}"
    measures:
      - name: data_up_point_custom_count
        type: count
        title: "data_up_point_custom记录数"
        description: "data_up_point_custom 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: point_id
        sql: "{CUBE}.`pointId`"
        type: string
        primary_key: true
        public: true
        title: "pointId"
        description: "数据库字段 pointId，物理类型为 varchar。"
      - name: config_id
        sql: "{CUBE}.`configId`"
        type: string
        title: "configId"
        description: "数据库字段 configId，物理类型为 varchar。"
      - name: point_name
        sql: "{CUBE}.`pointName`"
        type: string
        title: "pointName"
        description: "数据库字段 pointName，物理类型为 varchar。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"
      - name: is_auto_time
        sql: "{CUBE}.`isAutoTime`"
        type: number
        title: "是否自动生成时间：1是，0否"
        description: "是否自动生成时间：1是，0否。"
      - name: real_time_data_type
        sql: "{CUBE}.`realTimeDataType`"
        type: number
        title: "实时数据生成模式：1数据项配置，2脚本生成"
        description: "实时数据生成模式：1数据项配置，2脚本生成。"
      - name: data_script
        sql: "{CUBE}.`dataScript`"
        type: string
        public: false
        title: "数据生成脚本内容"
        description: "数据生成脚本内容。"
      - name: data_script_path
        sql: "{CUBE}.`dataScriptPath`"
        type: string
        public: false
        title: "数据生成脚本路径"
        description: "数据生成脚本路径。"

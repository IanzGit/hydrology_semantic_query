cubes:
  - name: base_data_up_config_custom
    sql_table: data_up_config_custom
    title: "定制数据上传配置"
    description: "data_up_config_custom 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 定制数据上传配置 的基础记录和字段"
    measures:
      - name: data_up_config_custom_count
        type: count
        title: "定制数据上传配置记录数"
        description: "data_up_config_custom 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: config_id
        sql: "{CUBE}.`configId`"
        type: string
        primary_key: true
        public: true
        title: "configId"
        description: "数据库字段 configId，物理类型为 varchar。"
      - name: custom_name
        sql: "{CUBE}.`customName`"
        type: string
        title: "customName"
        description: "数据库字段 customName，物理类型为 varchar。"
      - name: frequency
        sql: "{CUBE}.`frequency`"
        type: number
        title: "实时数据上传频率"
        description: "实时数据上传频率。"
      - name: category
        sql: "{CUBE}.`category`"
        type: number
        title: "category"
        description: "数据库字段 category，物理类型为 int。"
      - name: up_type
        sql: "{CUBE}.`upType`"
        type: string
        title: "upType"
        description: "数据库字段 upType，物理类型为 varchar。"
      - name: port
        sql: "{CUBE}.`PORT`"
        type: string
        title: "PORT"
        description: "数据库字段 PORT，物理类型为 varchar。"
      - name: mode_path
        sql: "{CUBE}.`modePath`"
        type: string
        public: false
        title: "modePath"
        description: "数据库字段 modePath，物理类型为 varchar。"
      - name: ip_address
        sql: "{CUBE}.`ipAddress`"
        type: string
        title: "ipAddress"
        description: "数据库字段 ipAddress，物理类型为 varchar。"
      - name: last_real_time_up_time
        sql: "{CUBE}.`lastRealTimeUpTime`"
        type: time
        title: "实时数据上次上传时间"
        description: "实时数据上次上传时间。"
      - name: ftp_username
        sql: "{CUBE}.`FTPUsername`"
        type: string
        title: "FTPUsername"
        description: "数据库字段 FTPUsername，物理类型为 varchar。"
      - name: ftp_pwd
        sql: "{CUBE}.`FTPPwd`"
        type: string
        public: false
        title: "FTPPwd"
        description: "数据库字段 FTPPwd，物理类型为 varchar。"
      - name: is_up
        sql: "{CUBE}.`isUp`"
        type: number
        title: "isUp"
        description: "数据库字段 isUp，物理类型为 int。"
      - name: coal_mine_name
        sql: "{CUBE}.`coalMineName`"
        type: string
        title: "coalMineName"
        description: "数据库字段 coalMineName，物理类型为 varchar。"
      - name: coal_mine_code
        sql: "{CUBE}.`coalMineCode`"
        type: string
        title: "coalMineCode"
        description: "数据库字段 coalMineCode，物理类型为 varchar。"

cubes:
  - name: base_forecast_history
    sql_table: forecast_history
    public: true
    description: "forecast_history 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "forecast_history"
      business_domain: hydrology
      aliases:
        - "forecast_history"
        - "预测历史记录"
      use_cases:
        - "查询 预测历史记录 的基础记录和字段"
      priority: 0.2
    measures:
      - name: forecast_history_count
        type: count
        description: "forecast_history 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: history_id
        sql: "{CUBE}.`historyId`"
        type: string
        primary_key: true
        public: true
        description: "预测历史id。"
      - name: config_id
        sql: "{CUBE}.`configId`"
        type: string
        description: "预测配置id。"
      - name: model_id
        sql: "{CUBE}.`modelId`"
        type: string
        description: "预测模型id。"
      - name: source_id
        sql: "{CUBE}.`sourceId`"
        type: string
        description: "预测数据源(传感器)id。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"

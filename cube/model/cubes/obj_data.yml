cubes:
  - name: base_obj_data
    sql_table: obj_data
    title: "obj_data"
    description: "obj_data 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 obj_data 的基础记录和字段"
    measures:
      - name: obj_data_count
        type: count
        title: "obj_data记录数"
        description: "obj_data 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        title: "id"
        description: "id。"
      - name: parent_id
        sql: "{CUBE}.`parentId`"
        type: string
        title: "父级id"
        description: "父级id。"
      - name: tree_code
        sql: "{CUBE}.`treeCode`"
        type: string
        title: "目录树code"
        description: "目录树code。"
      - name: name
        sql: "{CUBE}.`name`"
        type: string
        title: "名称"
        description: "名称。"
      - name: path
        sql: "{CUBE}.`path`"
        type: string
        public: false
        title: "路径"
        description: "路径。"
      - name: obj_path
        sql: "{CUBE}.`objPath`"
        type: string
        public: false
        title: "obj路径"
        description: "obj路径。"
      - name: mtl_path
        sql: "{CUBE}.`mtlPath`"
        type: string
        public: false
        title: "mtl路径"
        description: "mtl路径。"
      - name: diaphaneity
        sql: "{CUBE}.`diaphaneity`"
        type: number
        title: "透明度"
        description: "透明度。"
      - name: is_z_add
        sql: "{CUBE}.`isZAdd`"
        type: number
        title: "是否z增"
        description: "是否z增。"
      - name: playup
        sql: "{CUBE}.`playup`"
        type: number
        title: "渲染顺序"
        description: "渲染顺序。"
      - name: grouping
        sql: "{CUBE}.`grouping`"
        type: string
        title: "显示分组"
        description: "显示分组。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"

cubes:
  - name: base_sys_user_role
    sql_table: sys_user_role
    public: true
    description: "sys_user_role 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "sys_user_role"
      business_domain: hydrology
      aliases:
        - "sys_user_role"
      use_cases:
        - "查询 sys_user_role 的基础记录和字段"
      priority: 0.2
    joins:
      - name: base_sys_roleinfo
        relationship: many_to_one
        sql: "{CUBE}.`roleId` = {base_sys_roleinfo.role_id}"
    measures:
      - name: sys_user_role_count
        type: count
        description: "sys_user_role 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: record_key
        sql: "CONCAT(LENGTH(CAST({CUBE}.`userId` AS BINARY)), ':', HEX(CAST({CUBE}.`userId` AS BINARY)), ':', LENGTH(CAST({CUBE}.`roleId` AS BINARY)), ':', HEX(CAST({CUBE}.`roleId` AS BINARY)))"
        type: string
        primary_key: true
        public: false
        description: "由数据库声明的复合主键 userId、roleId 无歧义编码得到。"
      - name: user_id
        sql: "{CUBE}.`userId`"
        type: string
        description: "数据库字段 userId，物理类型为 varchar。"
      - name: role_id
        sql: "{CUBE}.`roleId`"
        type: string
        description: "数据库字段 roleId，物理类型为 varchar。"

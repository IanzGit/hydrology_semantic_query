cubes:
  - name: base_diagram_pump_facility
    sql_table: diagram_pump_facility
    title: "组态图泵房设备配置"
    description: "diagram_pump_facility 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 组态图泵房设备配置 的基础记录和字段"
    measures:
      - name: diagram_pump_facility_count
        type: count
        title: "组态图泵房设备配置记录数"
        description: "diagram_pump_facility 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: facility_id
        sql: "{CUBE}.`facilityId`"
        type: string
        primary_key: true
        public: true
        title: "facilityId"
        description: "数据库字段 facilityId，物理类型为 varchar。"
      - name: pump_id
        sql: "{CUBE}.`pumpId`"
        type: string
        title: "所属泵房id"
        description: "所属泵房id。"
      - name: facility_type
        sql: "{CUBE}.`facilityType`"
        type: string
        title: "设施类型(dibhole 水仓,valve 阀门,centrifugal离心泵)"
        description: "设施类型(dibhole 水仓,valve 阀门,centrifugal离心泵)。"
      - name: facility_name
        sql: "{CUBE}.`facilityName`"
        type: string
        title: "设施名称"
        description: "设施名称。"
      - name: show_x
        sql: "{CUBE}.`showX`"
        type: number
        title: "显示坐标x"
        description: "显示坐标x。"
      - name: show_y
        sql: "{CUBE}.`showY`"
        type: number
        title: "显示坐标y"
        description: "显示坐标y。"
      - name: pel_id
        sql: "{CUBE}.`pelId`"
        type: string
        title: "图源Id"
        description: "图源Id。"
      - name: notes
        sql: "{CUBE}.`notes`"
        type: string
        title: "备注"
        description: "备注。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"

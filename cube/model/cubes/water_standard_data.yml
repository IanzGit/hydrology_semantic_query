cubes:
  - name: base_water_standard_data
    sql_table: water_standard_data
    title: "water_standard_data"
    description: "water_standard_data 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 water_standard_data 的基础记录和字段"
    measures:
      - name: water_standard_data_count
        type: count
        title: "water_standard_data记录数"
        description: "water_standard_data 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        title: "id"
        description: "数据库字段 id，物理类型为 char。"
      - name: water_no
        sql: "{CUBE}.`waterNo`"
        type: string
        title: "水样编号"
        description: "水样编号。"
      - name: sampling_place
        sql: "{CUBE}.`samplingPlace`"
        type: string
        title: "采样地点"
        description: "采样地点。"
      - name: aquifer
        sql: "{CUBE}.`aquifer`"
        type: string
        title: "含水层"
        description: "含水层。"
      - name: sampling_date
        sql: "{CUBE}.`samplingDate`"
        type: time
        title: "采样日期"
        description: "采样日期。"
      - name: sampling_person
        sql: "{CUBE}.`samplingPerson`"
        type: string
        title: "采样人"
        description: "采样人。"
      - name: send_date

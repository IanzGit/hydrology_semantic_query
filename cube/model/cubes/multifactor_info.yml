cubes:
  - name: base_multifactor_info
    sql_table: multifactor_info
    public: true
    description: "multifactor_info 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "multifactor_info"
      business_domain: hydrology
      aliases:
        - "multifactor_info"
        - "多因素信息"
      use_cases:
        - "查询 多因素信息 的基础记录和字段"
      priority: 0.2
    measures:
      - name: multifactor_info_count
        type: count
        description: "multifactor_info 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: mult_id
        sql: "{CUBE}.`multId`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 multId，物理类型为 varchar。"
      - name: mult_name
        sql: "{CUBE}.`multName`"
        type: string
        description: "多因素名称。"
      - name: place
        sql: "{CUBE}.`place`"
        type: string
        description: "安装位置。"
      - name: coordinate_x
        sql: "{CUBE}.`coordinateX`"
        type: number
        description: "坐标x。"
      - name: coordinate_y
        sql: "{CUBE}.`coordinateY`"
        type: number
        description: "坐标y。"
      - name: judgment_id
        sql: "{CUBE}.`judgmentId`"
        type: string
        description: "预警模型id。"
      - name: judgment_file_base64
        sql: "{CUBE}.`judgmentFileBase64`"
        type: string
        description: "预警模型base64。"
      - name: is_open_warn
        sql: "{CUBE}.`isOpenWarn`"
        type: number
        description: "是否开启预警。"
      - name: polymerize_frequency
        sql: "{CUBE}.`polymerizeFrequency`"
        type: string
        description: "聚合频率。"
      - name: current_val
        sql: "{CUBE}.`currentVal`"
        type: string
        description: "聚合值。"
      - name: state
        sql: "{CUBE}.`state`"
        type: string
        description: "状态。"
      - name: last_poly_time
        sql: "{CUBE}.`lastPolyTime`"
        type: time
        description: "最新聚合时间。"
      - name: direction
        sql: "{CUBE}.`direction`"
        type: string
        description: "配置分组。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

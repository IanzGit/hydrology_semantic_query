cubes:
  - name: base_simulation_roadway
    sql_table: simulation_roadway
    title: "水害仿真-巷道"
    description: "simulation_roadway 表的基础记录；一行对应一条物理记录，数据库未声明主键，因此不参与 Cube Join。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 水害仿真-巷道 的基础记录和字段"
    measures:
      - name: simulation_roadway_count
        type: count
        title: "水害仿真-巷道记录数"
        description: "simulation_roadway 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: sequence
        sql: "{CUBE}.`seq`"
        type: number
        title: "巷道序号"
        description: "巷道序号。"
      - name: code
        sql: "{CUBE}.`code`"
        type: number
        title: "巷道编号"
        description: "巷道编号。"
      - name: name
        sql: "{CUBE}.`name`"
        type: string
        title: "巷道名称"
        description: "巷道名称。"
      - name: width
        sql: "{CUBE}.`width`"
        type: number
        title: "巷道宽度"
        description: "巷道宽度。"
      - name: height
        sql: "{CUBE}.`height`"
        type: number
        title: "巷道高度"
        description: "巷道高度。"
      - name: closed_state
        sql: "{CUBE}.`closedState`"
        type: number
        title: "封闭状态(0 未封闭, 1 已封闭)"
        description: "封闭状态(0 未封闭, 1 已封闭)。"
      - name: start_p_code
        sql: "{CUBE}.`startPCode`"
        type: number
        title: "巷道开始点位编号"
        description: "巷道开始点位编号。"
      - name: stop_p_code
        sql: "{CUBE}.`stopPCode`"
        type: number
        title: "巷道结束点位编号"
        description: "巷道结束点位编号。"
      - name: screen_id
        sql: "{CUBE}.`screenId`"
        type: string
        title: "大屏Id"
        description: "大屏Id。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"

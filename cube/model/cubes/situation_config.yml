cubes:
  - name: base_situation_config
    sql_table: situation_config
    title: "水害态势"
    description: "situation_config 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 水害态势 的基础记录和字段"
    measures:
      - name: situation_config_count
        type: count
        title: "水害态势记录数"
        description: "situation_config 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: situation_id
        sql: "{CUBE}.`situationId`"
        type: string
        primary_key: true
        public: true
        title: "水害态势id"
        description: "水害态势id。"
      - name: name
        sql: "{CUBE}.`name`"
        type: string
        title: "名称"
        description: "名称。"
      - name: score
        sql: "{CUBE}.`score`"
        type: number
        title: "分值"
        description: "分值。"
      - name: last_calc_time
        sql: "{CUBE}.`lastCalcTime`"
        type: time
        title: "最后计算时间"
        description: "最后计算时间。"
      - name: frequency
        sql: "{CUBE}.`frequency`"
        type: string
        title: "计算频率"
        description: "计算频率。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"

cubes:
  - name: base_water_source_analysis
    sql_table: water_source_analysis
    title: "water_source_analysis"
    description: "water_source_analysis 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 water_source_analysis 的基础记录和字段"
    measures:
      - name: water_source_analysis_count
        type: count
        title: "water_source_analysis记录数"
        description: "water_source_analysis 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        title: "id"
        description: "数据库字段 id，物理类型为 char。"
      - name: type
        sql: "{CUBE}.`type`"
        type: string
        title: "分析类型"
        description: "分析类型。"
      - name: ion_ph
        sql: "{CUBE}.`ionPH`"
        type: string
        title: "PH值"
        description: "PH值。"
      - name: ion_k
        sql: "{CUBE}.`ionK`"
        type: string
        title: "钾离子，K+"
        description: "钾离子，K+。"
      - name: ion_na
        sql: "{CUBE}.`ionNa`"
        type: string
        title: "钠离子，Na+"
        description: "钠离子，Na+。"
      - name: ion_ca
        sql: "{CUBE}.`ionCa`"
        type: string
        title: "钙离子，Ca2+"
        description: "钙离子，Ca2+。"
      - name: ion_mg
        sql: "{CUBE}.`ionMg`"
        type: string
        title: "镁离子，Mg2+"
        description: "镁离子，Mg2+。"
      - name: ion_cl
        sql: "{CUBE}.`ionCl`"
        type: string
        title: "氯离子，Cl-"
        description: "氯离子，Cl-。"
      - name: ion_so
        sql: "{CUBE}.`ionSO`"
        type: string
        title: "硫酸根，SO42-"
        description: "硫酸根，SO42-。"
      - name: ion_co
        sql: "{CUBE}.`ionCO`"
        type: string
        title: "碳酸根，CO32-"
        description: "碳酸根，CO32-。"
      - name: ion_hco
        sql: "{CUBE}.`ionHCO`"
        type: string
        title: "碳酸氢根，HCO3-"
        description: "碳酸氢根，HCO3-。"
      - name: ion_oh
        sql: "{CUBE}.`ionOH`"
        type: string
        title: "氢氧根，OH-"
        description: "氢氧根，OH-。"
      - name: hydrochemical_type
        sql: "{CUBE}.`hydrochemicalType`"
        type: string
        title: "水化学类型"
        description: "水化学类型。"
      - name: water_source_type
        sql: "{CUBE}.`waterSourceType`"
        type: string
        title: "水源类型"
        description: "水源类型。"
      - name: mixed_water_ratio
        sql: "{CUBE}.`mixedWaterRatio`"
        type: string
        title: "混合水比例"
        description: "混合水比例。"
      - name: piper_path
        sql: "{CUBE}.`piperPath`"
        type: string
        public: false
        title: "piper图路径"
        description: "piper图路径。"
      - name: add_data_time
        sql: "{CUBE}.`addDataTime`"
        type: time
        title: "加入标准水样库时间"
        description: "加入标准水样库时间。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: mineralization
        sql: "{CUBE}.`mineralization`"
        type: string
        title: "矿化度"
        description: "矿化度。"
      - name: hardness
        sql: "{CUBE}.`hardness`"
        type: string
        title: "总硬度"
        description: "总硬度。"
      - name: hardness_co
        sql: "{CUBE}.`hardnessCO`"
        type: string
        title: "碳酸硬度"
        description: "碳酸硬度。"
      - name: hardness_noco
        sql: "{CUBE}.`hardnessNOCO`"
        type: string
        title: "非碳酸硬度"
        description: "非碳酸硬度。"
      - name: negative_hardness
        sql: "{CUBE}.`negativeHardness`"
        type: string
        title: "负硬度"
        description: "负硬度。"
      - name: total_acidity
        sql: "{CUBE}.`totalAcidity`"
        type: string
        title: "总酸度"
        description: "总酸度。"
      - name: total_alkalinity
        sql: "{CUBE}.`totalAlkalinity`"
        type: string
        title: "总碱度"
        description: "总碱度。"
      - name: is_warm
        sql: "{CUBE}.`isWarm`"
        type: number
        title: "是否预警"
        description: "是否预警。"
      - name: set_id
        sql: "{CUBE}.`setId`"
        type: string
        title: "配置id"
        description: "配置id。"

cubes:
  - name: base_screen_device
    sql_table: screen_device
    public: true
    description: "screen_device 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "screen_device"
      business_domain: hydrology
      aliases:
        - "screen_device"
      use_cases:
        - "查询 screen_device 的基础记录和字段"
      priority: 0.2
    measures:
      - name: screen_device_count
        type: count
        description: "screen_device 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 id，物理类型为 varchar。"
      - name: device_id
        sql: "{CUBE}.`deviceId`"
        type: string
        description: "设备id。"
      - name: value_id
        sql: "{CUBE}.`valueId`"
        type: string
        description: "传感器id。"
      - name: name
        sql: "{CUBE}.`name`"
        type: string
        description: "名字。"
      - name: setting_name
        sql: "{CUBE}.`settingName`"
        type: string
        description: "配置名称：矿井涌水量等。"
      - name: calculation_type
        sql: "{CUBE}.`calculationType`"
        type: string
        description: "计算类型: 0或空为不计算,1为涌水量计算,2为排水量计算,3为降雨量计算。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"
      - name: seam_id
        sql: "{CUBE}.`seamId`"
        type: string
        description: "所属煤层id。"
      - name: face_id
        sql: "{CUBE}.`faceId`"
        type: string
        description: "所属工作面id。"
      - name: direction
        sql: "{CUBE}.`direction`"
        type: string
        description: "显示方向。"
      - name: view_direction
        sql: "{CUBE}.`viewDirection`"
        type: string
        description: "设备显示位置。"
      - name: show_value_type
        sql: "{CUBE}.`showValueType`"
        type: string
        description: "显示值类型。"
      - name: offset_h
        sql: "{CUBE}.`offsetH`"
        type: number
        description: "内容显示高度，程序默认100。"
      - name: device_type
        sql: "{CUBE}.`deviceType`"
        type: number
        description: "设备类型 0 或空 为默认类型 ,1天气设备。"
      - name: weather_type
        sql: "{CUBE}.`weatherType`"
        type: string
        description: "天气设备类型。"
      - name: source_x
        sql: "{CUBE}.`sourceX`"
        type: string
        description: "x源坐标。"
      - name: source_y
        sql: "{CUBE}.`sourceY`"
        type: string
        description: "y源坐标。"
      - name: transforms_x
        sql: "{CUBE}.`transformsX`"
        type: string
        description: "dxf上的x坐标。"
      - name: transforms_y
        sql: "{CUBE}.`transformsY`"
        type: string
        description: "dxf上的y坐标。"
      - name: sequence
        sql: "{CUBE}.`seq`"
        type: number
        description: "显示序号。"
      - name: point_id
        sql: "{CUBE}.`pointId`"
        type: string
        description: "点位id。"

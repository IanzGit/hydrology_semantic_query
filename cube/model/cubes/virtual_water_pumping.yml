cubes:
  - name: base_virtual_water_pumping
    sql_table: virtual_water_pumping
    public: true
    description: "virtual_water_pumping 表的基础记录；一行对应一条物理记录，数据库未声明主键，因此不参与 Cube Join。"
    meta:
      source_table: "virtual_water_pumping"
      business_domain: hydrology
      aliases:
        - "virtual_water_pumping"
        - "虚拟抽水实验数据表"
      use_cases:
        - "查询 虚拟抽水实验数据表 的基础记录和字段"
      priority: 0.2
    measures:
      - name: virtual_water_pumping_count
        type: count
        description: "virtual_water_pumping 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        description: "数据库字段 id，物理类型为 varchar。"
      - name: point_code
        sql: "{CUBE}.`point_code`"
        type: string
        description: "编号。"
      - name: point_x
        sql: "{CUBE}.`point_x`"
        type: number
        description: "X坐标。"
      - name: point_y
        sql: "{CUBE}.`point_y`"
        type: number
        description: "Y坐标。"
      - name: unit_inflow
        sql: "{CUBE}.`unit_inflow`"
        type: number
        description: "单位涌水量(L/s*m)。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

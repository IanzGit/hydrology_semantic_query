cubes:
  - name: base_geology_config
    sql_table: geology_config
    title: "透明地质-采集配置"
    description: "geology_config 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 透明地质-采集配置 的基础记录和字段"
    measures:
      - name: geology_config_count
        type: count
        title: "透明地质-采集配置记录数"
        description: "geology_config 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: config_id
        sql: "{CUBE}.`configId`"
        type: string
        primary_key: true
        public: true
        title: "configId"
        description: "数据库字段 configId，物理类型为 varchar。"
      - name: collect_name
        sql: "{CUBE}.`collectName`"
        type: string
        title: "配置名称"
        description: "配置名称。"
      - name: collect_type
        sql: "{CUBE}.`collectType`"
        type: string
        title: "采集类型 drillHoleClosed:封闭不良钻孔,abandonedmine:废弃老窑,miningFace:工作面,tunnel:巷道,gobwater:采空区"
        description: "采集类型 drillHoleClosed:封闭不良钻孔,abandonedmine:废弃老窑,miningFace:工作面,tunnel:巷道,gobwater:采空区。"
      - name: method_type
        sql: "{CUBE}.`methodType`"
        type: string
        title: "接入方式 web_api"
        description: "接入方式 web_api。"
      - name: http_method
        sql: "{CUBE}.`httpMethod`"
        type: string
        title: "调用方式 get/post"
        description: "调用方式 get/post。"
      - name: http_type
        sql: "{CUBE}.`httpType`"
        type: string
        title: "协议类型 http/https"
        description: "协议类型 http/https。"
      - name: ip_address
        sql: "{CUBE}.`ipAddress`"
        type: string
        title: "ip地址"
        description: "ip地址。"
      - name: port
        sql: "{CUBE}.`port`"
        type: string
        title: "端口号"
        description: "端口号。"
      - name: function_path
        sql: "{CUBE}.`functionPath`"
        type: string
        public: false
        title: "功能路径"
        description: "功能路径。"
      - name: show_col
        sql: "{CUBE}.`showCol`"
        type: string
        title: "显示字段,多个使用&分隔"
        description: "显示字段,多个使用&分隔。"
      - name: body_param
        sql: "{CUBE}.`bodyParam`"
        type: string
        title: "请求体参数"
        description: "请求体参数。"
      - name: frequency
        sql: "{CUBE}.`frequency`"
        type: number
        title: "采集频率"
        description: "采集频率。"
      - name: last_collect_time
        sql: "{CUBE}.`lastCollectTime`"
        type: time
        title: "最后采集时间"
        description: "最后采集时间。"
      - name: analysis_file_id
        sql: "{CUBE}.`analysisFileId`"
        type: string
        title: "解析脚本fileId"
        description: "解析脚本fileId。"
      - name: analysis_base64
        sql: "{CUBE}.`analysisBase64`"
        type: string
        title: "解析脚本base64"
        description: "解析脚本base64。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"
      - name: history_select
        sql: "{CUBE}.`historySelect`"
        type: string
        title: "历史查询字段"
        description: "历史查询字段。"
      - name: table_name
        sql: "{CUBE}.`tableName`"
        type: string
        title: "数据表名称"
        description: "数据表名称。"
      - name: sort_name
        sql: "{CUBE}.`sortName`"
        type: string
        title: "排序字段名称"
        description: "排序字段名称。"

cubes:
  - name: base_sys_tokeninfo_temp
    sql_table: sys_tokeninfo_temp
    public: true
    description: "sys_tokeninfo_temp 表的基础记录；一行对应一条物理记录，数据库未声明主键，因此不参与 Cube Join。"
    meta:
      source_table: "sys_tokeninfo_temp"
      business_domain: hydrology
      aliases:
        - "sys_tokeninfo_temp"
      use_cases:
        - "查询 sys_tokeninfo_temp 的基础记录和字段"
      priority: 0.2
    measures:
      - name: sys_tokeninfo_temp_count
        type: count
        description: "sys_tokeninfo_temp 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: token_id
        sql: "{CUBE}.`tokenId`"
        type: string
        public: false
        description: "数据库字段 tokenId，物理类型为 varchar。"
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: notes
        sql: "{CUBE}.`remark`"
        type: string
        description: "记录备注。"
      - name: token_name
        sql: "{CUBE}.`tokenName`"
        type: string
        public: false
        description: "数据库字段 tokenName，物理类型为 varchar。"
      - name: token_value
        sql: "{CUBE}.`tokenValue`"
        type: string
        public: false
        description: "数据库字段 tokenValue，物理类型为 varchar。"
      - name: group_id
        sql: "{CUBE}.`groupId`"
        type: string
        description: "数据库字段 groupId，物理类型为 varchar。"

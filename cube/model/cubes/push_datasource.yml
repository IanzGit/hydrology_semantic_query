cubes:
  - name: base_push_datasource
    sql_table: push_datasource
    title: "数据推送-数据来源"
    description: "push_datasource 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 数据推送-数据来源 的基础记录和字段"
    measures:
      - name: push_datasource_count
        type: count
        title: "数据推送-数据来源记录数"
        description: "push_datasource 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: datasource_id
        sql: "{CUBE}.`datasourceId`"
        type: string
        primary_key: true
        public: true
        title: "datasourceId"
        description: "数据库字段 datasourceId，物理类型为 varchar。"
      - name: source_name
        sql: "{CUBE}.`sourceName`"
        type: string
        title: "来源名称"
        description: "来源名称。"
      - name: source_type
        sql: "{CUBE}.`sourceType`"
        type: string
        title: "数据来源"
        description: "数据来源。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"

cubes:
  - name: base_screen_warning
    sql_table: screen_warning
    public: true
    description: "screen_warning 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "screen_warning"
      business_domain: hydrology
      aliases:
        - "screen_warning"
        - "大屏梯度预警图"
      use_cases:
        - "查询 大屏梯度预警图 的基础记录和字段"
      priority: 0.2
    measures:
      - name: screen_warning_count
        type: count
        description: "screen_warning 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: config_id
        sql: "{CUBE}.`configId`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 configId，物理类型为 varchar。"
      - name: screen_id
        sql: "{CUBE}.`screenId`"
        type: string
        description: "模块id(大屏id)。"
      - name: name
        sql: "{CUBE}.`name`"
        type: string
        description: "配置名称。"
      - name: source_id
        sql: "{CUBE}.`sourceId`"
        type: string
        description: "数据源id。"
      - name: source_type
        sql: "{CUBE}.`sourceType`"
        type: string
        description: "数据源类型。"
      - name: direction
        sql: "{CUBE}.`direction`"
        type: string
        description: "显示分组。"
      - name: seam_id
        sql: "{CUBE}.`seamId`"
        type: string
        description: "显示分组。"
      - name: face_id
        sql: "{CUBE}.`faceId`"
        type: string
        description: "工作面id。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

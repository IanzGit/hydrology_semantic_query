cubes:
  - name: base_sys_dictionaryinfo
    sql_table: sys_dictionaryinfo
    title: "sys_dictionaryinfo"
    description: "sys_dictionaryinfo 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 sys_dictionaryinfo 的基础记录和字段"
    joins:
      - name: base_sys_groupinfo
        relationship: many_to_one
        sql: "{CUBE}.`groupId` = {base_sys_groupinfo.group_id}"
    measures:
      - name: sys_dictionaryinfo_count
        type: count
        title: "sys_dictionaryinfo记录数"
        description: "sys_dictionaryinfo 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: layout_id
        sql: "{CUBE}.`layout_id`"
        type: string
        primary_key: true
        public: true
        title: "layout_id"
        description: "数据库字段 layout_id，物理类型为 varchar。"
      - name: dictionary
        sql: "{CUBE}.`dictionary`"
        type: string
        title: "dictionary"
        description: "数据库字段 dictionary，物理类型为 varchar。"
      - name: dict_name
        sql: "{CUBE}.`dictName`"
        type: string
        title: "dictName"
        description: "数据库字段 dictName，物理类型为 varchar。"
      - name: parent_id
        sql: "{CUBE}.`parentId`"
        type: string
        title: "parentId"
        description: "数据库字段 parentId，物理类型为 varchar。"
      - name: group_id
        sql: "{CUBE}.`groupId`"
        type: string
        title: "groupId"
        description: "数据库字段 groupId，物理类型为 varchar。"
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: notes
        sql: "{CUBE}.`remark`"
        type: string
        title: "备注"
        description: "记录备注。"
      - name: user_id
        sql: "{CUBE}.`userId`"
        type: string
        title: "userId"
        description: "数据库字段 userId，物理类型为 varchar。"
      - name: sequence
        sql: "{CUBE}.`seq`"
        type: number
        title: "序号"
        description: "记录配置序号。"

cubes:
  - name: base_three_data_dir
    sql_table: three_data_dir
    title: "三维数据目录"
    description: "three_data_dir 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 三维数据目录 的基础记录和字段"
    measures:
      - name: three_data_dir_count
        type: count
        title: "三维数据目录记录数"
        description: "three_data_dir 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: dir_id
        sql: "{CUBE}.`dirId`"
        type: string
        primary_key: true
        public: true
        title: "dirId"
        description: "数据库字段 dirId，物理类型为 varchar。"
      - name: sequence
        sql: "{CUBE}.`seq`"
        type: number
        title: "序号"
        description: "记录配置序号。"
      - name: name
        sql: "{CUBE}.`name`"
        type: string
        title: "name"
        description: "数据库字段 name，物理类型为 varchar。"
      - name: path
        sql: "{CUBE}.`path`"
        type: string
        public: false
        title: "path"
        description: "数据库字段 path，物理类型为 varchar。"
      - name: parent_id
        sql: "{CUBE}.`parentId`"
        type: string
        title: "parentId"
        description: "数据库字段 parentId，物理类型为 varchar。"
      - name: tree_code
        sql: "{CUBE}.`treeCode`"
        type: string
        title: "treeCode"
        description: "数据库字段 treeCode，物理类型为 varchar。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"

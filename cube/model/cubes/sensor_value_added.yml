cubes:
  - name: base_sensor_value_added
    sql_table: sensor_value_added
    public: true
    description: "sensor_value_added 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "sensor_value_added"
      business_domain: hydrology
      aliases:
        - "sensor_value_added"
        - "传感器增值信息"
      use_cases:
        - "查询 传感器增值信息 的基础记录和字段"
      priority: 0.2
    measures:
      - name: sensor_value_added_count
        type: count
        description: "sensor_value_added 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: add_id
        sql: "{CUBE}.`addId`"
        type: string
        primary_key: true
        public: true
        description: "增值id。"
      - name: sensor_id
        sql: "{CUBE}.`sensorId`"
        type: string
        description: "传感器id。"
      - name: add_name
        sql: "{CUBE}.`addName`"
        type: string
        description: "增值名称。"
      - name: show_type
        sql: "{CUBE}.`showType`"
        type: string
        description: "显示方式。"
      - name: calc_type
        sql: "{CUBE}.`calcType`"
        type: string
        description: "计算类型。"
      - name: calc_param
        sql: "{CUBE}.`calcParam`"
        type: string
        description: "计算参数。"
      - name: unit
        sql: "{CUBE}.`unit`"
        type: string
        description: "单位。"
      - name: cur_value
        sql: "{CUBE}.`curValue`"
        type: string
        description: "当前值。"
      - name: value_time
        sql: "{CUBE}.`valueTime`"
        type: time
        description: "值时间。"
      - name: value_state
        sql: "{CUBE}.`valueState`"
        type: string
        description: "值状态。"
      - name: judg_id
        sql: "{CUBE}.`judgId`"
        type: string
        description: "预警模型id。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "是否启用。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建人id。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "修改时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "修改人id。"

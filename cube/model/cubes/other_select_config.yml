cubes:
  - name: base_other_select_config
    sql_table: other_select_config
    public: true
    description: "other_select_config 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "other_select_config"
      business_domain: hydrology
      aliases:
        - "other_select_config"
        - "其他数据查询配置表"
      use_cases:
        - "查询 其他数据查询配置表 的基础记录和字段"
      priority: 0.2
    measures:
      - name: other_select_config_count
        type: count
        description: "other_select_config 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 id，物理类型为 varchar。"
      - name: config_type
        sql: "{CUBE}.`configType`"
        type: string
        description: "配置类型。"
      - name: select_name
        sql: "{CUBE}.`selectName`"
        type: string
        description: "查询名称。"
      - name: select_class
        sql: "{CUBE}.`selectClass`"
        type: string
        description: "查询类。"
      - name: select_type
        sql: "{CUBE}.`selectType`"
        type: string
        description: "数据类型。"
      - name: select_key
        sql: "{CUBE}.`selectKey`"
        type: string
        description: "默认主键。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

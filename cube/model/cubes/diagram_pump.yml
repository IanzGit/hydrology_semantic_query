cubes:
  - name: base_diagram_pump
    sql_table: diagram_pump
    public: true
    description: "diagram_pump 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "diagram_pump"
      business_domain: hydrology
      aliases:
        - "diagram_pump"
        - "组态图泵房配置"
      use_cases:
        - "查询 组态图泵房配置 的基础记录和字段"
      priority: 0.2
    measures:
      - name: diagram_pump_count
        type: count
        description: "diagram_pump 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: pump_id
        sql: "{CUBE}.`pumpId`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 pumpId，物理类型为 varchar。"
      - name: pump_name
        sql: "{CUBE}.`pumpName`"
        type: string
        description: "泵房名称。"
      - name: dxf_file_id
        sql: "{CUBE}.`dxfFileId`"
        type: string
        description: "dxf文件id。"
      - name: dxf_js_path
        sql: "{CUBE}.`dxfJsPath`"
        type: string
        public: false
        description: "dxfjs路径。"
      - name: notes
        sql: "{CUBE}.`notes`"
        type: string
        description: "备注。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

cubes:
  - name: base_sys_menu
    sql_table: sys_menu
    public: true
    description: "sys_menu 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "sys_menu"
      business_domain: hydrology
      aliases:
        - "sys_menu"
      use_cases:
        - "查询 sys_menu 的基础记录和字段"
      priority: 0.2
    measures:
      - name: sys_menu_count
        type: count
        description: "sys_menu 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 id，物理类型为 varchar。"
      - name: name
        sql: "{CUBE}.`name`"
        type: string
        description: "数据库字段 name，物理类型为 varchar。"
      - name: icopath
        sql: "{CUBE}.`icopath`"
        type: string
        public: false
        description: "数据库字段 icopath，物理类型为 varchar。"
      - name: expanded
        sql: "{CUBE}.`expanded`"
        type: string
        description: "数据库字段 expanded，物理类型为 varchar。"
      - name: link
        sql: "{CUBE}.`link`"
        type: string
        description: "数据库字段 link，物理类型为 varchar。"
      - name: parent_id
        sql: "{CUBE}.`parentId`"
        type: string
        description: "数据库字段 parentId，物理类型为 varchar。"
      - name: sequence
        sql: "{CUBE}.`seq`"
        type: number
        description: "记录配置序号。"
      - name: is_have_child
        sql: "{CUBE}.`isHaveChild`"
        type: number
        description: "数据库字段 isHaveChild，物理类型为 int。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: color
        sql: "{CUBE}.`color`"
        type: string
        description: "颜色代码。"
      - name: target
        sql: "{CUBE}.`target`"
        type: string
        description: "如果未null,跳转到右边iframe。"

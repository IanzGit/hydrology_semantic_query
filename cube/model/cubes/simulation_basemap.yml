cubes:
  - name: base_simulation_basemap
    sql_table: simulation_basemap
    public: true
    description: "simulation_basemap 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "simulation_basemap"
      business_domain: hydrology
      aliases:
        - "simulation_basemap"
      use_cases:
        - "查询 simulation_basemap 的基础记录和字段"
      priority: 0.2
    measures:
      - name: simulation_basemap_count
        type: count
        description: "simulation_basemap 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 id，物理类型为 varchar。"
      - name: sequence
        sql: "{CUBE}.`seq`"
        type: number
        description: "记录配置序号。"
      - name: name
        sql: "{CUBE}.`name`"
        type: string
        description: "名称。"
      - name: type
        sql: "{CUBE}.`type`"
        type: string
        description: "类型(3d,2d)。"
      - name: dxf_path
        sql: "{CUBE}.`dxfPath`"
        type: string
        public: false
        description: "dxf路径。"
      - name: js_path
        sql: "{CUBE}.`jsPath`"
        type: string
        public: false
        description: "js路径。"
      - name: screen_id
        sql: "{CUBE}.`screenId`"
        type: string
        description: "大屏id。"
      - name: direction
        sql: "{CUBE}.`direction`"
        type: string
        description: "数据库字段 direction，物理类型为 varchar。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

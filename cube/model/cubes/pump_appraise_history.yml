cubes:
  - name: base_pump_appraise_history
    sql_table: pump_appraise_history
    public: true
    description: "pump_appraise_history 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "pump_appraise_history"
      business_domain: hydrology
      aliases:
        - "pump_appraise_history"
        - "排水能力评估历史表"
      use_cases:
        - "查询 排水能力评估历史表 的基础记录和字段"
      priority: 0.2
    measures:
      - name: pump_appraise_history_count
        type: count
        description: "pump_appraise_history 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: history_id
        sql: "{CUBE}.`historyId`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 historyId，物理类型为 varchar。"
      - name: pump_id
        sql: "{CUBE}.`pumpId`"
        type: string
        description: "数据库字段 pumpId，物理类型为 varchar。"
      - name: pump_name
        sql: "{CUBE}.`pumpName`"
        type: string
        description: "泵房名称。"
      - name: drainage_capacity
        sql: "{CUBE}.`drainageCapacity`"
        type: number
        description: "排水能力。"
      - name: max_drainage_capacity
        sql: "{CUBE}.`maxDrainageCapacity`"
        type: number
        description: "最大排水能力。"
      - name: appraise
        sql: "{CUBE}.`appraise`"
        type: number
        description: "排水能力评估。"
      - name: max_appraise
        sql: "{CUBE}.`maxAppraise`"
        type: number
        description: "最大排水能力评估。"
      - name: water_inflow
        sql: "{CUBE}.`waterInflow`"
        type: number
        description: "涌水量(小时平均)。"
      - name: max_water_inflow
        sql: "{CUBE}.`maxWaterInflow`"
        type: number
        description: "最大涌水量(小时平均)。"
      - name: appraise_time
        sql: "{CUBE}.`appraiseTime`"
        type: time
        description: "评估时间。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

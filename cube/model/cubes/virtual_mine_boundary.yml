cubes:
  - name: base_virtual_mine_boundary
    sql_table: virtual_mine_boundary
    public: true
    description: "virtual_mine_boundary 表的基础记录；一行对应一条物理记录，数据库未声明主键，因此不参与 Cube Join。"
    meta:
      source_table: "virtual_mine_boundary"
      business_domain: hydrology
      aliases:
        - "virtual_mine_boundary"
        - "虚拟矿井边界表"
      use_cases:
        - "查询 虚拟矿井边界表 的基础记录和字段"
      priority: 0.2
    measures:
      - name: virtual_mine_boundary_count
        type: count
        description: "virtual_mine_boundary 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        description: "数据库字段 id，物理类型为 varchar。"
      - name: boundary_name
        sql: "{CUBE}.`boundary_name`"
        type: string
        description: "边界名称。"
      - name: boundary_json_text
        sql: boundary_json
        type: string
        description: "数据库以文本保存的边界多边形JSON。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

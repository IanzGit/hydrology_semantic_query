cubes:
  - name: base_push_point_default
    sql_table: push_point_default
    public: true
    description: "push_point_default 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "push_point_default"
      business_domain: hydrology
      aliases:
        - "push_point_default"
      use_cases:
        - "查询 push_point_default 的基础记录和字段"
      priority: 0.2
    measures:
      - name: push_point_default_count
        type: count
        description: "push_point_default 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: default_id
        sql: "{CUBE}.`defaultId`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 defaultId，物理类型为 varchar。"
      - name: name
        sql: "{CUBE}.`name`"
        type: string
        description: "名称。"
      - name: data_json
        sql: "{CUBE}.`dataJson`"
        type: string
        description: "数据(json格式)。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

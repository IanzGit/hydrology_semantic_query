cubes:
  - name: base_auto_report
    sql_table: auto_report
    title: "智能分析表"
    description: "auto_report 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 智能分析表 的基础记录和字段"
    measures:
      - name: auto_report_count
        type: count
        title: "智能分析表记录数"
        description: "auto_report 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        title: "id"
        description: "数据库字段 id，物理类型为 varchar。"
      - name: sequence
        sql: "{CUBE}.`seq`"
        type: number
        title: "序号"
        description: "序号。"
      - name: source_id
        sql: "{CUBE}.`sourceId`"
        type: string
        title: "来源配置id"
        description: "来源配置id。"
      - name: report_type
        sql: "{CUBE}.`reportType`"
        type: string
        title: "报告类型"
        description: "报告类型。"
      - name: report_name
        sql: "{CUBE}.`reportName`"
        type: string
        title: "报告名称"
        description: "报告名称。"
      - name: analysis_start_time
        sql: "{CUBE}.`analysisStartTime`"
        type: time
        title: "最后生成时间"
        description: "最后生成时间。"
      - name: analysis_stop_time
        sql: "{CUBE}.`analysisStopTime`"
        type: time
        title: "最后生成时间"
        description: "最后生成时间。"
      - name: file_id
        sql: "{CUBE}.`fileId`"
        type: string
        title: "报告文件"
        description: "报告文件。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"
      - name: pdf_file_id
        sql: "{CUBE}.`pdfFileId`"
        type: string
        title: "pdfFileId"
        description: "pdfFileId。"

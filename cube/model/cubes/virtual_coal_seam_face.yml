cubes:
  - name: base_virtual_coal_seam_face
    sql_table: virtual_coal_seam_face
    public: true
    description: "virtual_coal_seam_face 表的基础记录；一行对应一条物理记录，数据库未声明主键，因此不参与 Cube Join。"
    meta:
      source_table: "virtual_coal_seam_face"
      business_domain: hydrology
      aliases:
        - "virtual_coal_seam_face"
        - "虚拟工作面边界表"
      use_cases:
        - "查询 虚拟工作面边界表 的基础记录和字段"
      priority: 0.2
    measures:
      - name: virtual_coal_seam_face_count
        type: count
        description: "virtual_coal_seam_face 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        description: "数据库字段 id，物理类型为 varchar。"
      - name: workface_name
        sql: "{CUBE}.`workface_name`"
        type: string
        description: "工作面名称。"
      - name: x1
        sql: "{CUBE}.`x1`"
        type: number
        description: "边界角点1 x。"
      - name: y1
        sql: "{CUBE}.`y1`"
        type: number
        description: "边界角点1 y。"
      - name: x2
        sql: "{CUBE}.`x2`"
        type: number
        description: "边界角点2 x。"
      - name: y2
        sql: "{CUBE}.`y2`"
        type: number
        description: "边界角点2 y。"
      - name: x3
        sql: "{CUBE}.`x3`"
        type: number
        description: "边界角点3 x。"
      - name: y3
        sql: "{CUBE}.`y3`"
        type: number
        description: "边界角点3 y。"
      - name: x4
        sql: "{CUBE}.`x4`"
        type: number
        description: "边界角点4 x。"
      - name: y4
        sql: "{CUBE}.`y4`"
        type: number
        description: "边界角点4 y。"
      - name: node_id
        sql: "{CUBE}.`node_id`"
        type: string
        description: "关联 simulation_point.code，逗号分隔。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

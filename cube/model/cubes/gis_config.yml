cubes:
  - name: base_gis_config
    sql_table: gis_config
    public: true
    description: "gis_config 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "gis_config"
      business_domain: hydrology
      aliases:
        - "gis_config"
      use_cases:
        - "查询 gis_config 的基础记录和字段"
      priority: 0.2
    measures:
      - name: gis_config_count
        type: count
        description: "gis_config 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 id，物理类型为 char。"
      - name: bg_img_path
        sql: "{CUBE}.`bgImgPath`"
        type: string
        public: false
        description: "数据库字段 bgImgPath，物理类型为 varchar。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

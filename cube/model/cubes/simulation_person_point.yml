cubes:
  - name: base_simulation_person_point
    sql_table: simulation_person_point
    public: true
    description: "simulation_person_point 表的基础记录；一行对应一条物理记录，数据库未声明主键，因此不参与 Cube Join。"
    meta:
      source_table: "simulation_person_point"
      business_domain: hydrology
      aliases:
        - "simulation_person_point"
        - "水害仿真-人员定位数据"
      use_cases:
        - "查询 水害仿真-人员定位数据 的基础记录和字段"
      priority: 0.2
    measures:
      - name: simulation_person_point_count
        type: count
        description: "simulation_person_point 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: person_id
        sql: "{CUBE}.`personId`"
        type: string
        description: "人员id。"
      - name: person_name
        sql: "{CUBE}.`personName`"
        type: string
        description: "人员名称。"
      - name: point_x
        sql: "{CUBE}.`pointX`"
        type: number
        description: "节点x。"
      - name: point_y
        sql: "{CUBE}.`pointY`"
        type: number
        description: "节点y。"
      - name: point_z
        sql: "{CUBE}.`pointZ`"
        type: number
        description: "节点z。"
      - name: screen_id
        sql: "{CUBE}.`screenId`"
        type: string
        description: "大屏Id。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

cubes:
  - name: base_three_data_file
    sql_table: three_data_file
    public: true
    description: "three_data_file 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "three_data_file"
      business_domain: hydrology
      aliases:
        - "three_data_file"
        - "三维数据文件"
      use_cases:
        - "查询 三维数据文件 的基础记录和字段"
      priority: 0.2
    measures:
      - name: three_data_file_count
        type: count
        description: "three_data_file 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 id，物理类型为 varchar。"
      - name: dir_id
        sql: "{CUBE}.`dirId`"
        type: string
        description: "数据库字段 dirId，物理类型为 varchar。"
      - name: sequence
        sql: "{CUBE}.`seq`"
        type: number
        description: "记录配置序号。"
      - name: name
        sql: "{CUBE}.`name`"
        type: string
        description: "数据库字段 name，物理类型为 varchar。"
      - name: obj_path
        sql: "{CUBE}.`objPath`"
        type: string
        public: false
        description: "数据库字段 objPath，物理类型为 varchar。"
      - name: mtl_path
        sql: "{CUBE}.`mtlPath`"
        type: string
        public: false
        description: "数据库字段 mtlPath，物理类型为 varchar。"
      - name: type
        sql: "{CUBE}.`type`"
        type: string
        description: "数据库字段 type，物理类型为 varchar。"
      - name: x
        sql: "{CUBE}.`x`"
        type: number
        description: "数据库字段 x，物理类型为 double。"
      - name: y
        sql: "{CUBE}.`y`"
        type: number
        description: "数据库字段 y，物理类型为 double。"
      - name: z
        sql: "{CUBE}.`z`"
        type: number
        description: "数据库字段 z，物理类型为 double。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

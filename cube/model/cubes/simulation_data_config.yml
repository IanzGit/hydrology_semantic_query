cubes:
  - name: base_simulation_data_config
    sql_table: simulation_data_config
    title: "水害仿真数据接入配置"
    description: "simulation_data_config 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 水害仿真数据接入配置 的基础记录和字段"
    measures:
      - name: simulation_data_config_count
        type: count
        title: "水害仿真数据接入配置记录数"
        description: "simulation_data_config 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        title: "id"
        description: "数据库字段 id，物理类型为 varchar。"
      - name: config_type
        sql: "{CUBE}.`configType`"
        type: string
        title: "配置类型"
        description: "配置类型。"
      - name: method_type
        sql: "{CUBE}.`methodType`"
        type: string
        title: "数据接入方式"
        description: "数据接入方式。"
      - name: http_type
        sql: "{CUBE}.`httpType`"
        type: string
        title: "协议类型"
        description: "协议类型。"
      - name: ip_address
        sql: "{CUBE}.`ipAddress`"
        type: string
        title: "ip地址"
        description: "ip地址。"
      - name: port
        sql: "{CUBE}.`port`"
        type: string
        title: "端口号"
        description: "端口号。"
      - name: function_path
        sql: "{CUBE}.`functionPath`"
        type: string
        public: false
        title: "功能路径"
        description: "功能路径。"
      - name: analysis_id
        sql: "{CUBE}.`analysisId`"
        type: string
        title: "解析脚本id"
        description: "解析脚本id。"
      - name: analysis_base64
        sql: "{CUBE}.`analysisBase64`"
        type: string
        title: "解析脚本base64"
        description: "解析脚本base64。"
      - name: frequency
        sql: "{CUBE}.`frequency`"
        type: number
        title: "计算频率"
        description: "计算频率。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"
      - name: last_execute_time
        sql: "{CUBE}.`lastExecuteTime`"
        type: time
        title: "最近执行时间"
        description: "最近执行时间。"
      - name: user_name
        sql: "{CUBE}.`userName`"
        type: string
        title: "连接账号"
        description: "连接账号。"
      - name: password
        sql: "{CUBE}.`password`"

      - name: select_form
        sql: "{CUBE}.`selectForm`"
        type: string
        title: "查询主体"
        description: "查询主体。"
      - name: select_result
        sql: "{CUBE}.`selectResult`"
        type: string
        title: "查询内容"
        description: "查询内容。"
      - name: select_where
        sql: "{CUBE}.`selectWhere`"
        type: string
        title: "查询条件"
        description: "查询条件。"
      - name: select_order

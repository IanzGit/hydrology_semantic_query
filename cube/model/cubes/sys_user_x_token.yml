cubes:
  - name: base_sys_user_x_token
    sql_table: sys_user_x_token
    public: true
    description: "sys_user_x_token 表的基础记录；一行对应一条物理记录，数据库未声明主键，因此不参与 Cube Join。"
    meta:
      source_table: "sys_user_x_token"
      business_domain: hydrology
      aliases:
        - "sys_user_x_token"
      use_cases:
        - "查询 sys_user_x_token 的基础记录和字段"
      priority: 0.2
    measures:
      - name: sys_user_x_token_count
        type: count
        description: "sys_user_x_token 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: user_id
        sql: "{CUBE}.`userId`"
        type: string
        description: "数据库字段 userId，物理类型为 varchar。"
      - name: token_id
        sql: "{CUBE}.`tokenId`"
        type: string
        public: false
        description: "数据库字段 tokenId，物理类型为 varchar。"

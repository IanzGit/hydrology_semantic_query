cubes:
  - name: base_device_state_log
    sql_table: device_state_log
    public: true
    description: "device_state_log 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "device_state_log"
      business_domain: hydrology
      aliases:
        - "device_state_log"
      use_cases:
        - "查询 device_state_log 的基础记录和字段"
      priority: 0.2
    measures:
      - name: device_state_log_count
        type: count
        description: "device_state_log 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 id，物理类型为 char。"
      - name: device_id
        sql: "{CUBE}.`deviceId`"
        type: string
        description: "数据库字段 deviceId，物理类型为 char。"
      - name: state
        sql: "{CUBE}.`state`"
        type: string
        description: "数据库字段 state，物理类型为 varchar。"
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: place
        sql: "{CUBE}.`place`"
        type: string
        description: "报警位置。"
      - name: threshold
        sql: "{CUBE}.`threshold`"
        type: string
        description: "阈值。"
      - name: parameter
        sql: "{CUBE}.`parameter`"
        type: string
        description: "参数名称。"
      - name: value_id
        sql: "{CUBE}.`valueId`"
        type: string
        description: "数据库字段 valueId，物理类型为 varchar。"
      - name: station_id
        sql: "{CUBE}.`stationId`"
        type: string
        description: "数据库字段 stationId，物理类型为 varchar。"
      - name: switch_id
        sql: "{CUBE}.`switchId`"
        type: string
        description: "数据库字段 switchId，物理类型为 varchar。"
      - name: data_create_date
        sql: "{CUBE}.`dataCreateDate`"
        type: time
        description: "数据创建时间。"

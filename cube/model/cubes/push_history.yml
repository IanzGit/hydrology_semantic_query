cubes:
  - name: base_push_history
    sql_table: push_history
    title: "数据推送历史"
    description: "push_history 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 数据推送历史 的基础记录和字段"
    measures:
      - name: push_history_count
        type: count
        title: "数据推送历史记录数"
        description: "push_history 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: history_id
        sql: "{CUBE}.`historyId`"
        type: string
        primary_key: true
        public: true
        title: "historyId"
        description: "数据库字段 historyId，物理类型为 varchar。"
      - name: config_id
        sql: "{CUBE}.`configId`"
        type: string
        title: "所属配置id"
        description: "所属配置id。"
      - name: push_target_url
        sql: "{CUBE}.`pushTargetUrl`"
        type: string
        title: "推送目标url"
        description: "推送目标url。"
      - name: push_time
        sql: "{CUBE}.`pushTime`"
        type: time
        title: "推送时间"
        description: "推送时间。"
      - name: push_result
        sql: "{CUBE}.`pushResult`"
        type: string
        title: "推送结果"
        description: "推送结果。"
      - name: push_result_content
        sql: "{CUBE}.`pushResultContent`"
        type: string
        title: "推送结果详情"
        description: "推送结果详情。"
      - name: data_file_id
        sql: "{CUBE}.`dataFileId`"
        type: string
        title: "推送数据"
        description: "推送数据。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"
      - name: warn_event_id
        sql: "{CUBE}.`warnEventId`"
        type: string
        title: "warnEventId"
        description: "数据库字段 warnEventId，物理类型为 text。"

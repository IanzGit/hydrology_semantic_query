cubes:
  - name: base_autoreport_point
    sql_table: autoreport_point
    public: true
    description: "autoreport_point 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "autoreport_point"
      business_domain: hydrology
      aliases:
        - "autoreport_point"
        - "智能分析节点配置表"
      use_cases:
        - "查询 智能分析节点配置表 的基础记录和字段"
      priority: 0.2
    measures:
      - name: autoreport_point_count
        type: count
        description: "autoreport_point 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: point_id
        sql: "{CUBE}.`pointId`"
        type: string
        primary_key: true
        public: true
        description: "节点id。"
      - name: config_id
        sql: "{CUBE}.`configId`"
        type: string
        description: "配置id。"
      - name: point_type
        sql: "{CUBE}.`pointType`"
        type: string
        description: "节点类型。"
      - name: point_name
        sql: "{CUBE}.`pointName`"
        type: string
        description: "节点名称。"
      - name: template_file_id
        sql: "{CUBE}.`templateFileId`"
        type: string
        description: "模板fileId。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"
      - name: stats_type
        sql: "{CUBE}.`statsType`"
        type: string
        description: "统计类型。"
      - name: sequence
        sql: "{CUBE}.`seq`"
        type: number
        description: "序号。"

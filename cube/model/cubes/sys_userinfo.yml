cubes:
  - name: base_sys_userinfo
    sql_table: sys_userinfo
    public: true
    description: "sys_userinfo 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "sys_userinfo"
      business_domain: hydrology
      aliases:
        - "sys_userinfo"
      use_cases:
        - "查询 sys_userinfo 的基础记录和字段"
      priority: 0.2
    measures:
      - name: sys_userinfo_count
        type: count
        description: "sys_userinfo 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: user_id
        sql: "{CUBE}.`userId`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 userId，物理类型为 varchar。"
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: email
        sql: "{CUBE}.`email`"
        type: string
        description: "数据库字段 email，物理类型为 varchar。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: lastlogin_time
        sql: "{CUBE}.`lastloginTime`"
        type: time
        description: "数据库字段 lastloginTime，物理类型为 datetime。"
      - name: login_id
        sql: "{CUBE}.`loginId`"
        type: string
        description: "数据库字段 loginId，物理类型为 varchar。"
      - name: password
        sql: "{CUBE}.`password`"
        type: string
        public: false
        description: "数据库字段 password，物理类型为 varchar。"
      - name: phone
        sql: "{CUBE}.`phone`"
        type: string
        public: false
        description: "数据库字段 phone，物理类型为 varchar。"
      - name: real_name
        sql: "{CUBE}.`realName`"
        type: string
        description: "数据库字段 realName，物理类型为 varchar。"
      - name: notes
        sql: "{CUBE}.`remark`"
        type: string
        description: "记录备注。"
      - name: updated_at
        sql: "{CUBE}.`updateTime`"
        type: time
        description: "记录最近更新时间。"
      - name: weixin_id
        sql: "{CUBE}.`weixinId`"
        type: string
        description: "数据库字段 weixinId，物理类型为 varchar。"
      - name: school_id
        sql: "{CUBE}.`schoolId`"
        type: string
        description: "数据库字段 schoolId，物理类型为 varchar。"
      - name: dept_id
        sql: "{CUBE}.`deptId`"
        type: string
        description: "数据库字段 deptId，物理类型为 varchar。"
      - name: project_id
        sql: "{CUBE}.`projectId`"
        type: string
        description: "数据库字段 projectId，物理类型为 varchar。"
      - name: user_type
        sql: "{CUBE}.`userType`"
        type: string
        description: "数据库字段 userType，物理类型为 varchar。"
      - name: sso_id
        sql: "{CUBE}.`ssoId`"
        type: string
        description: "数据库字段 ssoId，物理类型为 varchar。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"
      - name: updated_at_2
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: error_pass_num
        sql: "{CUBE}.`errorPassNum`"
        type: number
        description: "密码错误次数。"
      - name: is_lockout
        sql: "{CUBE}.`isLockout`"
        type: number
        description: "是否锁定 1(密码错误) 可自动解锁  2(长期未登录)不可自动解锁 无值时表示。"
      - name: lockout_time
        sql: "{CUBE}.`lockoutTime`"
        type: time
        description: "锁定时间。"
      - name: lockout_reason
        sql: "{CUBE}.`LockoutReason`"
        type: string
        description: "锁定原因。"

cubes:
  - name: base_screen_water_source
    sql_table: screen_water_source
    title: "大屏水源地判定"
    description: "screen_water_source 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 大屏水源地判定 的基础记录和字段"
    measures:
      - name: screen_water_source_count
        type: count
        title: "大屏水源地判定记录数"
        description: "screen_water_source 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        title: "id"
        description: "数据库字段 id，物理类型为 varchar。"
      - name: setting_name
        sql: "{CUBE}.`settingName`"
        type: string
        title: "大屏id"
        description: "大屏id。"
      - name: seam_id
        sql: "{CUBE}.`seamId`"
        type: string
        title: "煤层id"
        description: "煤层id。"
      - name: face_id
        sql: "{CUBE}.`faceId`"
        type: string
        title: "工作面id"
        description: "工作面id。"
      - name: water_id
        sql: "{CUBE}.`waterId`"
        type: string
        title: "水源地定期分析配置id"
        description: "水源地定期分析配置id。"
      - name: name
        sql: "{CUBE}.`name`"
        type: string
        title: "显示名称"
        description: "显示名称。"
      - name: water_name
        sql: "{CUBE}.`waterName`"
        type: string
        title: "分析配置名称"
        description: "分析配置名称。"
      - name: warm_types
        sql: "{CUBE}.`warmTypes`"
        type: string
        title: "报警类别"
        description: "报警类别。"
      - name: frequency
        sql: "{CUBE}.`frequency`"
        type: string
        title: "预测频率"
        description: "预测频率。"
      - name: direction
        sql: "{CUBE}.`direction`"
        type: string
        title: "显示分组"
        description: "显示分组。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createTime`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: updated_at
        sql: "{CUBE}.`updateTime`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"

    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        title: "id"
        description: "数据库字段 id，物理类型为 varchar。"
      - name: web_id
        sql: "{CUBE}.`webId`"
        type: string
        title: "web配置id"
        description: "web配置id。"
      - name: param_key
        sql: "{CUBE}.`paramKey`"
        type: string
        title: "请求键"
        description: "请求键。"
      - name: param_value
        sql: "{CUBE}.`paramValue`"
        type: string
        title: "请求值"
        description: "请求值。"
      - name: type
        sql: "{CUBE}.`type`"
        type: string
        title: "值类型 (1:请求头,2:请求参数)"
        description: "值类型 (1:请求头,2:请求参数)。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createTime`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: updated_at
        sql: "{CUBE}.`updateTime`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"

cubes:
  - name: base_sys_tokeninfo
    sql_table: sys_tokeninfo
    public: true
    description: "sys_tokeninfo 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "sys_tokeninfo"
      business_domain: hydrology
      aliases:
        - "sys_tokeninfo"
      use_cases:
        - "查询 sys_tokeninfo 的基础记录和字段"
      priority: 0.2
    joins:
      - name: base_sys_tokengroupinfo
        relationship: many_to_one
        sql: "{CUBE}.`groupId` = {base_sys_tokengroupinfo.group_id}"
    measures:
      - name: sys_tokeninfo_count
        type: count
        description: "sys_tokeninfo 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: token_id
        sql: "{CUBE}.`tokenId`"
        type: string
        primary_key: true
        public: false
        description: "数据库字段 tokenId，物理类型为 varchar。"
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: notes
        sql: "{CUBE}.`remark`"
        type: string
        description: "记录备注。"
      - name: token_name
        sql: "{CUBE}.`tokenName`"
        type: string
        public: false
        description: "数据库字段 tokenName，物理类型为 varchar。"
      - name: token_value
        sql: "{CUBE}.`tokenValue`"
        type: string
        public: false
        description: "数据库字段 tokenValue，物理类型为 varchar。"
      - name: group_id
        sql: "{CUBE}.`groupId`"
        type: string
        description: "数据库字段 groupId，物理类型为 varchar。"
      - name: config_groups
        sql: "{CUBE}.`configGroups`"
        type: string
        description: "数据库字段 configGroups，物理类型为 varchar。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

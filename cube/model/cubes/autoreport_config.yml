cubes:
  - name: base_autoreport_config
    sql_table: autoreport_config
    title: "智能分析配置表"
    description: "autoreport_config 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 智能分析配置表 的基础记录和字段"
    measures:
      - name: autoreport_config_count
        type: count
        title: "智能分析配置表记录数"
        description: "autoreport_config 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: config_id
        sql: "{CUBE}.`configId`"
        type: string
        primary_key: true
        public: true
        title: "configId"
        description: "数据库字段 configId，物理类型为 varchar。"
      - name: config_name
        sql: "{CUBE}.`configName`"
        type: string
        title: "配置名称"
        description: "配置名称。"
      - name: frequency
        sql: "{CUBE}.`frequency`"
        type: string
        title: "生成频率(/次)"
        description: "生成频率(/次)。"
      - name: last_report_time
        sql: "{CUBE}.`lastReportTime`"
        type: time
        title: "最后生成时间"
        description: "最后生成时间。"
      - name: template_file_id
        sql: "{CUBE}.`templateFileId`"
        type: string
        title: "报告模板"
        description: "报告模板。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"

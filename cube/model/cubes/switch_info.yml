cubes:
  - name: base_switch_info
    sql_table: switch_info
    public: true
    description: "switch_info 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "switch_info"
      business_domain: hydrology
      aliases:
        - "switch_info"
      use_cases:
        - "查询 switch_info 的基础记录和字段"
      priority: 0.2
    measures:
      - name: switch_info_count
        type: count
        description: "switch_info 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 id，物理类型为 varchar。"
      - name: switch_name
        sql: "{CUBE}.`switchName`"
        type: string
        description: "数据库字段 switchName，物理类型为 varchar。"
      - name: switch_code
        sql: "{CUBE}.`switchCode`"
        type: string
        description: "数据库字段 switchCode，物理类型为 varchar。"
      - name: switch_install_address
        sql: "{CUBE}.`switchInstallAddress`"
        type: string
        description: "数据库字段 switchInstallAddress，物理类型为 varchar。"
      - name: switch_ip_address
        sql: "{CUBE}.`switchIpAddress`"
        type: string
        description: "数据库字段 switchIpAddress，物理类型为 varchar。"
      - name: created_at
        sql: "{CUBE}.`createTime`"
        type: time
        description: "记录创建时间。"
      - name: updated_at
        sql: "{CUBE}.`updateTime`"
        type: time
        description: "记录最近更新时间。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_by_id
        sql: "{CUBE}.`createUser`"
        type: string
        description: "创建记录的用户。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUser`"
        type: string
        description: "最近更新记录的用户。"
      - name: state
        sql: "{CUBE}.`state`"
        type: number
        description: "交换机状态,0离线，1在线。"
      - name: sequence
        sql: "{CUBE}.`seq`"
        type: number
        description: "序号。"

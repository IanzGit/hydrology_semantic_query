        title: "大屏计算频率配置记录数"
        description: "screen_cal_config 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        title: "id"
        description: "数据库字段 id，物理类型为 varchar。"
      - name: type
        sql: "{CUBE}.`type`"
        type: string
        title: "配置类型"
        description: "配置类型。"
      - name: screen_id
        sql: "{CUBE}.`screenId`"
        type: string
        title: "大屏id"
        description: "大屏id。"
      - name: cal_type
        sql: "{CUBE}.`calType`"
        type: string
        title: "计算类型"
        description: "计算类型。"
      - name: cal_time_long
        sql: "{CUBE}.`calTimeLong`"
        type: number
        title: "计算时长"
        description: "计算时长。"
      - name: frequency
        sql: "{CUBE}.`frequency`"
        type: number
        title: "计算频率"
        description: "计算频率。"
      - name: delay_time_long
        sql: "{CUBE}.`delayTimeLong`"
        type: number
        title: "延迟计算时长"
        description: "延迟计算时长。"
      - name: direction
        sql: "{CUBE}.`direction`"
        type: string
        title: "计算分组"
        description: "计算分组。"
      - name: timed_time
        sql: "{CUBE}.`timedTime`"
        type: time
        title: "定时时间"
        description: "定时时间。"
      - name: plan_exe_time
        sql: "{CUBE}.`planExeTime`"
        type: time
        title: "预计执行时间"
        description: "预计执行时间。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"

cubes:
  - name: base_screen_cal_config
    sql_table: screen_cal_config
    public: true
    description: "screen_cal_config 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "screen_cal_config"
      business_domain: hydrology
      aliases:
        - "screen_cal_config"
        - "大屏计算频率配置"
      use_cases:
        - "查询 大屏计算频率配置 的基础记录和字段"
      priority: 0.2
    measures:
      - name: screen_cal_config_count
        type: count
        description: "screen_cal_config 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 id，物理类型为 varchar。"
      - name: type
        sql: "{CUBE}.`type`"
        type: string
        description: "配置类型。"
      - name: screen_id
        sql: "{CUBE}.`screenId`"
        type: string
        description: "大屏id。"
      - name: cal_type
        sql: "{CUBE}.`calType`"
        type: string
        description: "计算类型。"
      - name: cal_time_long
        sql: "{CUBE}.`calTimeLong`"
        type: number
        description: "计算时长。"
      - name: frequency
        sql: "{CUBE}.`frequency`"
        type: number
        description: "计算频率。"
      - name: delay_time_long
        sql: "{CUBE}.`delayTimeLong`"
        type: number
        description: "延迟计算时长。"
      - name: direction
        sql: "{CUBE}.`direction`"
        type: string
        description: "计算分组。"
      - name: timed_time
        sql: "{CUBE}.`timedTime`"
        type: time
        description: "定时时间。"
      - name: plan_exe_time
        sql: "{CUBE}.`planExeTime`"
        type: time
        description: "预计执行时间。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

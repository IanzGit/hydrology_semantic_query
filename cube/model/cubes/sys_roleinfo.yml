cubes:
  - name: base_sys_roleinfo
    sql_table: sys_roleinfo
    title: "sys_roleinfo"
    description: "sys_roleinfo 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 sys_roleinfo 的基础记录和字段"
    measures:
      - name: sys_roleinfo_count
        type: count
        title: "sys_roleinfo记录数"
        description: "sys_roleinfo 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: role_id
        sql: "{CUBE}.`roleId`"
        type: string
        primary_key: true
        public: true
        title: "roleId"
        description: "数据库字段 roleId，物理类型为 varchar。"
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: notes
        sql: "{CUBE}.`remark`"
        type: string
        title: "备注"
        description: "记录备注。"
      - name: role_name
        sql: "{CUBE}.`roleName`"
        type: string
        title: "roleName"
        description: "数据库字段 roleName，物理类型为 varchar。"
      - name: group_id
        sql: "{CUBE}.`groupId`"
        type: string
        title: "groupId"
        description: "数据库字段 groupId，物理类型为 int。"
      - name: project_id
        sql: "{CUBE}.`projectId`"
        type: string
        title: "projectId"
        description: "数据库字段 projectId，物理类型为 varchar。"

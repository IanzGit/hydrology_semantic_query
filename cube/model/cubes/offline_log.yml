cubes:
  - name: base_offline_log
    sql_table: offline_log
    public: true
    description: "offline_log 表的基础记录；一行对应一条物理记录，数据库未声明主键，因此不参与 Cube Join。"
    meta:
      source_table: "offline_log"
      business_domain: hydrology
      aliases:
        - "offline_log"
        - "离线日志"
      use_cases:
        - "查询 离线日志 的基础记录和字段"
      priority: 0.2
    measures:
      - name: offline_log_count
        type: count
        description: "offline_log 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        description: "id。"
      - name: device_id
        sql: "{CUBE}.`deviceId`"
        type: string
        description: "设备id。"
      - name: sensor_id
        sql: "{CUBE}.`sensorId`"
        type: string
        description: "传感器id。"
      - name: offline_time
        sql: "{CUBE}.`offlineTime`"
        type: time
        description: "离线时间。"
      - name: online_time
        sql: "{CUBE}.`onlineTime`"
        type: time
        description: "重连时间。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

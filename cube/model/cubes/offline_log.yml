cubes:
  - name: base_offline_log
    sql_table: offline_log
    title: "离线日志"
    description: "offline_log 表的基础记录；一行对应一条物理记录，数据库未声明主键，因此不参与 Cube Join。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 离线日志 的基础记录和字段"
    measures:
      - name: offline_log_count
        type: count
        title: "离线日志记录数"
        description: "offline_log 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        title: "id"
        description: "id。"
      - name: device_id
        sql: "{CUBE}.`deviceId`"
        type: string
        title: "设备id"
        description: "设备id。"
      - name: sensor_id
        sql: "{CUBE}.`sensorId`"
        type: string
        title: "传感器id"
        description: "传感器id。"
      - name: offline_time
        sql: "{CUBE}.`offlineTime`"
        type: time
        title: "离线时间"
        description: "离线时间。"
      - name: online_time
        sql: "{CUBE}.`onlineTime`"
        type: time
        title: "重连时间"
        description: "重连时间。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"

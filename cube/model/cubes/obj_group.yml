cubes:
  - name: base_obj_group
    sql_table: obj_group
    title: "obj_group"
    description: "obj_group 表的基础记录；一行对应一条物理记录，数据库未声明主键，因此不参与 Cube Join。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 obj_group 的基础记录和字段"
    measures:
      - name: obj_group_count
        type: count
        title: "obj_group记录数"
        description: "obj_group 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        title: "id"
        description: "数据库字段 id，物理类型为 varchar。"
      - name: grouping
        sql: "{CUBE}.`grouping`"
        type: string
        title: "grouping"
        description: "数据库字段 grouping，物理类型为 varchar。"

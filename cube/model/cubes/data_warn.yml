cubes:
  - name: base_data_warn
    sql_table: data_warn
    title: "data_warn"
    description: "data_warn 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 data_warn 的基础记录和字段"
    measures:
      - name: data_warn_count
        type: count
        title: "data_warn记录数"
        description: "data_warn 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: warn_date
        sql: "{CUBE}.`warnDate`"
        type: time
        title: "预警时间"
        description: "预警时间。"
      - name: warn_type
        sql: "{CUBE}.`warnType`"
        type: string
        title: "预警类别（地表水、老空水等）"
        description: "预警类别（地表水、老空水等）。"
      - name: forecast_exceed_date
        sql: "{CUBE}.`forecastExceedDate`"
        type: time
        title: "预计超出阈值时间"
        description: "预计超出阈值时间。"
      - name: forecast_val
        sql: "{CUBE}.`forecastVal`"
        type: string
        title: "预计值"
        description: "预计值。"
      - name: source_type
        sql: "{CUBE}.`sourceType`"
        type: number
        title: "预警来源（1：单因素、2：多因素）"
        description: "预警来源（1：单因素、2：多因素）。"
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        title: "主键id"
        description: "主键id。"
      - name: risk_level
        sql: "{CUBE}.`riskLevel`"
        type: string
        title: "预警风险"
        description: "预警风险。"
      - name: forecast_id
        sql: "{CUBE}.`forecastId`"
        type: string
        title: "预测id"
        description: "预测id。"
      - name: warn_reason
        sql: "{CUBE}.`warnReason`"
        type: string
        title: "预警原因"
        description: "预警原因。"
      - name: remove_reason
        sql: "{CUBE}.`removeReason`"
        type: string
        title: "解除原因"
        description: "解除原因。"
      - name: remove_time
        sql: "{CUBE}.`removeTime`"
        type: time
        title: "解除时间"
        description: "解除时间。"
      - name: file_path
        sql: "{CUBE}.`filePath`"
        type: string
        public: false
        title: "解除预警时上传的附件"
        description: "解除预警时上传的附件。"
      - name: warn_category
        sql: "{CUBE}.`warnCategory`"
        type: string
        title: "预警类别：misreport误报、other其它"
        description: "预警类别：misreport误报、other其它。"
      - name: exception_content
        sql: "{CUBE}.`exceptionContent`"
        type: string
        title: "异常内容"
        description: "异常内容。"
      - name: record_person
        sql: "{CUBE}.`recordPerson`"
        type: string
        title: "记录人员"
        description: "记录人员。"
      - name: warn_event_id
        sql: "{CUBE}.`warnEventId`"
        type: string
        title: "预警事件id"
        description: "预警事件id。"
      - name: send_start_warn_msg_time
        sql: "{CUBE}.`sendStartWarnMsgTime`"
        type: time
        title: "预警开始时上传时间"
        description: "预警开始时上传时间。"
      - name: send_stop_warn_msg_time
        sql: "{CUBE}.`sendStopWarnMsgTime`"
        type: time
        title: "预警结束时上传时间"
        description: "预警结束时上传时间。"
      - name: warn_describe
        sql: "{CUBE}.`warnDescribe`"
        type: string
        title: "预警描述"
        description: "预警描述。"
      - name: warn_judg_value
        sql: "{CUBE}.`warnJudgValue`"
        type: string
        title: "预警判识值"
        description: "预警判识值。"
      - name: warn_judg_reason
        sql: "{CUBE}.`warnJudgReason`"
        type: string
        title: "预警判识原因"
        description: "预警判识原因。"

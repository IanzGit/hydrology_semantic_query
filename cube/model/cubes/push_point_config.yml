cubes:
  - name: base_push_point_config
    sql_table: push_point_config
    title: "数据推送点位配置表"
    description: "push_point_config 表的基础记录；一行对应一条物理记录。"
    meta:
      business_domain: hydrology
      use_cases:
        - "查询 数据推送点位配置表 的基础记录和字段"
    measures:
      - name: push_point_config_count
        type: count
        title: "数据推送点位配置表记录数"
        description: "push_point_config 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: point_id
        sql: "{CUBE}.`pointId`"
        type: string
        primary_key: true
        public: true
        title: "pointId"
        description: "数据库字段 pointId，物理类型为 varchar。"
      - name: config_id
        sql: "{CUBE}.`configId`"
        type: string
        title: "点位id"
        description: "点位id。"
      - name: point_name
        sql: "{CUBE}.`pointName`"
        type: string
        title: "点位名称"
        description: "点位名称。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        title: "是否启用"
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        title: "创建时间"
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        title: "创建用户ID"
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        title: "更新时间"
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        title: "更新用户ID"
        description: "最近更新记录的用户标识。"
      - name: default_id
        sql: "{CUBE}.`defaultId`"
        type: string
        title: "指标id"
        description: "指标id。"

cubes:
  - name: base_screen_fix_value
    sql_table: screen_fix_value
    public: true
    description: "screen_fix_value 表的基础记录；一行对应一条物理记录。"
    meta:
      source_table: "screen_fix_value"
      business_domain: hydrology
      aliases:
        - "screen_fix_value"
        - "大屏-固定值配置"
      use_cases:
        - "查询 大屏-固定值配置 的基础记录和字段"
      priority: 0.2
    measures:
      - name: screen_fix_value_count
        type: count
        description: "screen_fix_value 表物理记录数量，不施加默认过滤。"
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        description: "数据库字段 id，物理类型为 varchar。"
      - name: screen_id
        sql: "{CUBE}.`screenId`"
        type: string
        description: "大屏id。"
      - name: name
        sql: "{CUBE}.`name`"
        type: string
        description: "名称。"
      - name: value
        sql: "{CUBE}.`value`"
        type: string
        description: "值。"
      - name: direction
        sql: "{CUBE}.`direction`"
        type: string
        description: "分组。"
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: number
        description: "数据库保存的启用状态原始值，不施加默认过滤。"
        meta:
          projection_role: filter_only
      - name: created_at
        sql: "{CUBE}.`createDate`"
        type: time
        description: "记录创建时间。"
      - name: created_by_id
        sql: "{CUBE}.`createUserId`"
        type: string
        public: false
        description: "创建记录的用户标识。"
      - name: updated_at
        sql: "{CUBE}.`updateDate`"
        type: time
        description: "记录最近更新时间。"
      - name: updated_by_id
        sql: "{CUBE}.`updateUserId`"
        type: string
        public: false
        description: "最近更新记录的用户标识。"

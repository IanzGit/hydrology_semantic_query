views:
  - name: view_point_deployment_analysis
    title: 水文监测点位部署分析
    description: 查询当前有效监测点的定义、部署、量程、阈值及关联维度，每行代表一个监测点。
    public: true
    meta:
      ai_context: >-
        监测点的数量、清单、类型分布、地点分布、新增情况、量程、精度、逻辑点、累计量、上下限阈值及关联设备问题使用该 View。数据源已固定 SubSysId=1025，point_active_state 强制为1，因此只表示当前有效点位。新增、部署和首次安装时间使用 defined_at，不能使用 updated_at。监测类型优先按 value_type_id 精确过滤：水位12001、水温10202、水流量10501、PH值18511、水质电导率18512、浊度18513。实时值、历史值、周期统计和异常事件必须改用对应的场景 View。
      business_domain: hydrology_monitor
      aliases:
        - 水文监测点部署
        - 水文传感器配置
      use_cases:
        - 查询当前有效监测点清单、数量和类型分布
        - 查询某时间后新增或部署的监测点
        - 查询监测点量程、精度、单位和阈值配置
        - 按地点、设备或子系统筛选监测点
      default_projection:
        - mine_name
        - subsystem_name
        - address_name
        - point_name
        - value_type_name
        - subsystem_full_name
        - point_unit
        - device_name
        - defined_at
    cubes:
      - join_path: base_point_info
        includes:
          - name: code
            alias: point_code
          - name: name
            alias: point_name
          - name: short_name
            alias: point_short_name
          - name: unit
            alias: point_unit
          - measurement_principle
          - measurement_range
          - unit_scale
          - precision
          - is_logical
          - is_cumulative
          - upper_warning_threshold
          - upper_warning_release_threshold
          - upper_alarm_threshold
          - upper_alarm_release_threshold
          - upper_cutoff_threshold
          - upper_cutoff_release_threshold
          - lower_warning_threshold
          - lower_warning_release_threshold
          - lower_alarm_threshold
          - lower_alarm_release_threshold
          - lower_cutoff_threshold
          - lower_cutoff_release_threshold
          - defined_at
          - name: active_state
            alias: point_active_state
          - point_count
      - join_path: base_point_info.base_device_info
        includes:
          - name: name
            alias: device_name
          - name: code
            alias: device_code
          - name: model
            alias: device_model
          - factory_name
          - ip_address
          - name: installation_address
            alias: device_installation_address
          - use_status
          - is_virtual
          - enabled_at
      - join_path: base_point_info.base_device_info.role_parent_device_info
        includes:
          - name: code
            alias: parent_device_code
          - name: name
            alias: parent_device_name
      - join_path: base_point_info.base_device_info.base_mine_address
        includes:
          - name: name
            alias: device_address_name
      - join_path: base_point_info.base_device_info.base_m_dev_class_info
        includes:
          - name: name
            alias: device_class_name
      - join_path: base_point_info.role_component_device_info
        includes:
          - name: code
            alias: component_device_code
          - name: name
            alias: component_device_name
      - join_path: base_point_info.role_object_device_info
        includes:
          - name: code
            alias: object_device_code
          - name: name
            alias: object_device_name
      - join_path: base_point_info.base_m_value_type_sys
        includes:
          - name: name
            alias: value_type_name
      - join_path: base_point_info.base_address_type
        includes:
          - name: name
            alias: address_type_name
      - join_path: base_point_info.base_mine_address
        includes:
          - name: name
            alias: address_name
      - join_path: base_point_info.base_mine_unit_info
        includes:
          - name: name
            alias: mine_name
          - name: short_name
            alias: mine_short_name
      - join_path: base_point_info.base_sub_system_info
        includes:
          - name: name
            alias: subsystem_name
          - name: full_name
            alias: subsystem_full_name
    access_policy:
      - role: "*"
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: point_active_state
              operator: equals
              values:
                - "1"

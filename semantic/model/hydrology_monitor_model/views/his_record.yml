views:
  - name: view_his_record
    title: 水文监测历史明细
    description: 查询水文监测点的全量历史采样明细，每行代表一个采样时刻的记录。
    public: true
    meta:
      ai_context: >-
        历史趋势、历史曲线、最近一年、某时间段监测信息、历史明细和采样极值问题使用该 View。数据源已固定 SubSysId=1025。历史时间必须使用 observed_at，不能使用 updated_at。该 View 不过滤点位删除时间，已删除监测点删除前的历史记录仍应返回；仅当用户明确要求当前有效点位时才过滤 point_active_state=1。
      business_domain: hydrology_monitor
      aliases:
        - 水文历史监测
        - 水文历史曲线
        - 水文监测明细
      use_cases:
        - 查询历史时间序列与采样明细
        - 查询历史最大值、最小值和平均值
      default_projection:
        - point_code
        - point_name
        - value_type_name
        - display_value
        - value_status_id
        - observed_at
    cubes:
      - join_path: base_his_record
        includes:
          - point_id
          - value
          - display_value
          - is_running
          - observed_at
          - value_status_id
          - device_status_id
          - sample_count
          - maximum_value
          - minimum_value
          - average_value
      - join_path: base_his_record.base_point_info
        includes:
          - name: code
            alias: point_code
          - name: name
            alias: point_name
          - address_id
          - value_type_id
          - name: unit
            alias: point_unit
          - device_id
          - name: active_state
            alias: point_active_state
      - join_path: base_his_record.base_point_info.base_device_info
        includes:
          - name: name
            alias: device_name
          - name: code
            alias: device_code
      - join_path: base_his_record.base_point_info.base_m_value_type_sys
        includes:
          - name: name
            alias: value_type_name

views:
  - name: view_point_info
    title: 水文监测点定义
    description: 查询当前有效的水文监测点与传感器部署信息，每行代表一个监测点。
    public: true
    meta:
      ai_context: >-
        监测点数量、传感器数量、点位清单、部署、安装和新增点位问题使用该 View。数据源已固定 SubSysId=1025，point_active_state 强制为1，因此已删除监测点不会计入当前定义。新增、首次安装和首次上线时间必须使用 defined_at，不能使用 updated_at。监测值类型优先按 value_type_id 精确过滤；需要设备型号、厂家、IP或设备安装位置时使用设备成员。
      business_domain: hydrology_monitor
      aliases:
        - 水文监测点
        - 水文传感器定义
        - 水文点位清单
      use_cases:
        - 查询当前有效监测点清单与数量
        - 查询某时间后新增或安装的监测点
        - 按监测值类型、地点或设备筛选点位
      default_projection:
        - point_code
        - point_name
        - address_name
        - value_type_name
        - point_unit
        - device_name
        - defined_at
    cubes:
      - join_path: base_point_info
        includes:
          - point_id
          - name: code
            alias: point_code
          - name: name
            alias: point_name
          - address_id
          - value_type_id
          - name: unit
            alias: point_unit
          - device_id
          - defined_at
          - name: active_state
            alias: point_active_state
          - point_count
      - join_path: base_point_info.base_device_info
        includes:
          - name: name
            alias: device_name
          - name: code
            alias: device_code
          - name: model
            alias: device_model
          - factory_name
          - ip_address
          - name: installation_address
            alias: device_installation_address
          - use_status
          - enabled_at
      - join_path: base_point_info.base_m_value_type_sys
        includes:
          - name: name
            alias: value_type_name
      - join_path: base_point_info.base_mine_address
        includes:
          - name: name
            alias: address_name
    access_policy:
      - role: "*"
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: point_active_state
              operator: equals
              values:
                - "1"

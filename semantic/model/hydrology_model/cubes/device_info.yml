cubes:
  - name: base_device_info
    sql_table: device_info
    title: 水文监测设备
    description: 设备配置与设备当前状态的基础实体。
    meta:
      business_domain: hydrology
      ai_context: >-
        base_device_info.name 表示设备业务名称。当前已知设备业务名称包括：1#水质1、111、45201回顺密闭、45207回顺排水管道、45207涌水量、45207运顺排水管道、45208导水裂隙带高度、45208工作面、45208回顺排水管道、45208涌水量、45208运顺管道流量、45209回顺排水管道、45210运顺排水管道、85201超滤密闭、85201密闭液位、85203超滤供水管路、85203密闭液位、85205密闭、85207运顺密闭、85209密闭液位、85209运顺密闭、85211导水裂隙带、85211回顺排水管道、85211胶运排水管道、85211涌水量、85212辅撤回通道、85212回顺密闭、85212密闭外观测井、85213掘进、85217沉淀池水仓管道上、85217沉淀池水仓管道下、85217沉淀池水仓管道中、85217密闭液位、85218导水裂隙带、85219沉淀池水仓管道上、85219沉淀池水仓管道下、85219回顺密闭、85219密闭液位、85220导水裂隙带、85220工作面、85220回顺排水管道、85220运顺排水管道、8650m水仓密闭、8650m水仓密闭管道内、8650m水仓密闭管道外、8650米密闭液位、lan主动对接测试设备、八盘区复用泵房、八盘区回采工作面、八盘区老空积水区、八盘区水泵房、八盘区中转水仓、八盘区中转水仓水质、白石岩沟上游、白石岩沟下游、办公楼顶气象站、保护层厚度、变电所9700、测试LAN主动、长观孔-3#水文监测井、长观孔-J079-1、长观孔-J079-2、长观孔-J079-3、措施井底水仓口排水管道、措施井底水仓水质、第四系钻孔1、第四系钻孔2、第四系钻孔3、第四系钻孔5、第四系钻孔6、第四系钻孔ZK4、第四系钻孔ZK7、电厂供水泵房、二联巷、辅运8600米水仓密闭、副平硐井口、供电厂管道、红石墕沟上游南侧支流、红石墕沟上游右侧支流、红石墕沟下游、红石墕沟中下游南侧支流、红石墕沟中游、火赖沟上游、火赖沟下游、九联巷、开峁沟上游、开峁沟下游、矿井总涌水量、凉水河矿老窑井口、六联巷中转水泵房、六盘区集中辅运、六盘区集中胶运-掘锚队、六盘区集中胶运-连采二队、南翼二号、石岩梁老窑井口、四盘区、四盘区回采工作面、位置10800、消防泵房、熊洞老窑井口、延安组钻孔1、延安组钻孔2、延安组钻孔3、延安组钻孔4、延安组钻孔BK5、预留-涌水量14、预留-涌水量17、预留-涌水量18、预留-涌水量19、直滤硐室产水管路1、直滤硐室产水管路2、中央水仓、中央水仓水质、中转水仓、中转水仓口管道2。用户问题完整包含其中名称时，应优先使用 base_device_info.name 按完整名称过滤，不得截取盘区、工作面等片段绑定到其他字段。
      use_cases:
        - 查询设备配置、位置和状态
    measures:
      - name: device_count
        type: count
        title: 设备数
        description: 设备记录数量。
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        title: 设备ID
        description: 设备唯一标识。
      - name: name
        sql: "{CUBE}.`deviceName`"
        type: string
        title: 设备名称
        description: 设备业务名称。
      - name: code
        sql: "{CUBE}.`deviceCode`"
        type: string
        title: 设备编码
        description: 设备业务编码。
      - name: svg_position
        sql: "{CUBE}.`deviceSvgPosition`"
        type: string
        title: 设备图位置
        description: 设备在图形中的位置配置。
      - name: type_id
        sql: "{CUBE}.`belongTypeId`"
        type: string
        title: 设备类别ID
        description: 设备所属类别唯一标识。
      - name: type_name
        sql: "{CUBE}.`belongTypeName`"
        type: string
        title: 设备类别
        description: 设备所属类别名称。
      - name: station_id
        sql: "{CUBE}.`belongStationId`"
        type: string
        title: 所属分站ID
        description: 设备所属分站唯一标识。
      - name: station_name
        sql: "{CUBE}.`belongStationName`"
        type: string
        title: 所属分站
        description: 设备所属分站名称。
      - name: switch_id
        sql: "{CUBE}.`belongSwitchId`"
        type: string
        title: 所属交换机ID
        description: 设备所属交换机唯一标识。
      - name: switch_name
        sql: "{CUBE}.`belongSwitchName`"
        type: string
        title: 所属交换机
        description: 设备所属交换机名称。
      - name: place
        sql: "{CUBE}.`place`"
        type: string
        title: 安装位置
        description: 设备安装位置。
      - name: install_area
        sql: "{CUBE}.`installArea`"
        type: string
        title: 采集类型
        description: 设备配置的采集类型。
      - name: port
        sql: "{CUBE}.`PORT`"
        type: number
        title: 设备端口
        description: 设备配置的端口号，仅作为属性使用。
      - name: state
        sql: "{CUBE}.`state`"
        type: string
        title: 设备状态
        description: 设备当前状态。
      - name: state_updated_at
        sql: "{CUBE}.`stateUpdateTime`"
        type: time
        title: 设备状态改变时间
        description: 设备状态最近一次改变的时间。
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: boolean
        title: 设备是否启用
        description: 设备配置的启用状态。
      - name: offline_started_at
        sql: "{CUBE}.`offLineStartTime`"
        type: time
        title: 离线开始时间
        description: 设备进入离线状态的时间。
      - name: offline_stopped_at
        sql: "{CUBE}.`offLineStopTime`"
        type: time
        title: 离线结束时间
        description: 设备离线状态结束或恢复的时间。
    segments:
      - name: enabled
        sql: "{CUBE}.isEnable = 1"
        title: 已启用设备
        description: 仅保留已启用的设备。

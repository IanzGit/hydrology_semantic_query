cubes:
  - name: base_device_x_value
    sql_table: device_x_value
    title: 水文监测传感器
    description: 设备下传感器、当前值与状态的基础实体。
    meta:
      business_domain: hydrology
      ai_context: >-
        base_device_x_value.name 表示传感器或测点名称。当前已知传感器或测点名称包括：1号泵开停时间段、1号泵瞬时流量、1号累计流量、1号日累计流量、1号水泵开启时长、1号水泵开启时长-小时、1号水泵停止、1号水泵运行、1号水泵运行-模拟、1号瞬时流量、1号液位、2号泵开停时间段、2号泵瞬时流量、2号累计流量、2号日累计流量、2号水泵开启时长、2号水泵开启时长-小时、2号水泵停止、2号水泵运行、2号瞬时流量、2号液位、3号累计流量、3号日累计流量、3号水泵开启时长、3号水泵开启时长-小时、3号水泵停止、3号水泵运行、3号瞬时流量、45207回采进尺、45208回采进尺、45208回采最近地表水体距离、45208回采最近封闭不良钻孔距离、45208回采最近积水区距离、4号累计流量、4号日累计流量、4号水泵开启时长、4号水泵开启时长-小时、4号水泵停止、4号水泵运行、4号瞬时流量、85211回采进尺、85211回采最近地表河流距离、85211回采最近封闭不良钻孔距离、85211回采最近积水区距离、85211涌水量、85212采空区水位标高、85213掘进最近地表水体距离、85213掘进最近封闭不良钻孔距离、85213掘进最近积水区距离、85220涌水量、PH、八盘区中转水泵房排水量、采空区水位、大气压、电导率、电压、风速、风向、副平硐井口温度、钙离子、高度、厚度、厚度-火赖沟、厚度-开茆沟、积水标高、积水量、积水面积、钾离子、建议开泵数、降雨量、空高、孔口距水面高度、累计流量1、累计流量2、流量、流量2、流速、六联巷水泵房排水量、六盘区集中辅运最近地表水体距离、六盘区集中辅运最近封闭不良钻孔距离、六盘区集中辅运最近积水区距离、氯离子、埋深、镁离子、钠离子、日累计流量1、日累计流量2、渗漏量、湿度、水泵1开启时长、水泵1开启时长-小时、水泵1停止、水泵1运行、水泵2开启时长、水泵2开启时长-小时、水泵2停止、水泵2运行、水泵3开启时长、水泵3开启时长-小时、水泵3停止、水泵3运行、水位、水位标高、水温、水压、瞬时流量、瞬时流量1、瞬时流量2、未来72小时累计降雨量、温度、校准水位、压力、液位、液位1、涌水量、在线控制、中央平泵房排水量。用户问题完整包含其中名称时，应优先使用 base_device_x_value.name 按完整名称过滤，不得截取局部词语绑定到其他字段。
      use_cases:
        - 查询传感器当前值、状态和阈值
        - 结合监测设备或标签分析监测传感器
    joins:
      - name: base_device_info
        relationship: many_to_one
        sql: "{CUBE}.deviceId = {base_device_info.id}"
      - name: base_label_sensor
        relationship: one_to_many
        sql: "{CUBE}.id = {base_label_sensor.sensor_id}"
    measures:
      - name: sensor_count
        type: count
        title: 传感器数
        description: 传感器记录数量。
    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true
        public: true
        title: 传感器ID
        description: 传感器唯一标识。
      - name: device_id
        sql: "{CUBE}.`deviceId`"
        type: string
        title: 所属设备ID
        description: 传感器所属设备唯一标识。
      - name: sequence
        sql: "{CUBE}.`seq`"
        type: number
        title: 序号
        description: 传感器在设备下的配置序号。
      - name: name
        sql: "{CUBE}.`name`"
        type: string
        title: 传感器名称
        description: 传感器或测点名称。
      - name: alias
        sql: "{CUBE}.`alias`"
        type: string
        title: 传感器别名
        description: 传感器配置别名。
      - name: acquisition_cycle
        sql: "{CUBE}.`acquisitionCycle`"
        type: string
        title: 采集频率
        description: 传感器配置的采集频率。
      - name: analysis_id
        sql: "{CUBE}.`analysisId`"
        type: string
        title: 解析规则ID
        description: 传感器配置引用的解析规则标识。
      - name: register_address
        sql: "{CUBE}.`registerAddress`"
        type: string
        title: 寄存器地址
        description: 传感器配置的寄存器地址。
      - name: register_count
        sql: "{CUBE}.`registerCount`"
        type: string
        title: 寄存器数量
        description: 数据库以文本保存的寄存器数量配置。
      - name: start_index
        sql: "{CUBE}.`startIndex`"
        type: string
        title: 起始位置
        description: 数据库以文本保存的数据起始位置配置。
      - name: length
        sql: "{CUBE}.`lengths`"
        type: string
        title: 数据长度
        description: 数据库以文本保存的数据长度配置。
      - name: unit
        sql: "{CUBE}.`units`"
        type: string
        title: 计量单位
        description: 传感器值的计量单位。
      - name: current_value
        sql: "{CUBE}.`currentVal`"
        type: string
        title: 当前值
        description: 数据库以文本保存的传感器当前值，不预设数值聚合语义。
      - name: state
        sql: "{CUBE}.`state`"
        type: string
        title: 传感器状态
        description: 传感器当前状态。
      - name: state_updated_at
        sql: "{CUBE}.`stateUpdateTime`"
        type: time
        title: 传感器状态改变时间
        description: 传感器状态最近一次改变的时间。
      - name: value_updated_at
        sql: "{CUBE}.`valUpdateTime`"
        type: time
        title: 传感器值更新时间
        description: 最近一次接收到传感器值的时间。
      - name: minimum_threshold
        sql: "{CUBE}.`minThreshold`"
        type: string
        title: 最小报警阈值
        description: 数据库以文本保存的最小报警阈值。
      - name: maximum_threshold
        sql: "{CUBE}.`maxThreshold`"
        type: string
        title: 最大报警阈值
        description: 数据库以文本保存的最大报警阈值。
      - name: warning_enabled
        sql: "{CUBE}.`isOpenWarn`"
        type: boolean
        title: 是否开启预警
        description: 传感器是否开启预警功能。
      - name: single_factor
        sql: "{CUBE}.`isSingle`"
        type: boolean
        title: 是否单因素传感器
        description: 传感器是否配置为单因素预警来源。
      - name: is_enabled
        sql: "{CUBE}.`isEnable`"
        type: boolean
        title: 传感器是否启用
        description: 传感器配置的启用状态。
      - name: maximum_abnormal_value
        sql: "{CUBE}.`maxAbnormal`"
        type: string
        title: 最大异常值
        description: 数据库以文本保存、用于异常值判定的最大值。
      - name: minimum_abnormal_value
        sql: "{CUBE}.`minAbnormal`"
        type: string
        title: 最小异常值
        description: 数据库以文本保存、用于异常值判定的最小值。
      - name: point_x
        sql: "{CUBE}.`pointX`"
        type: number
        title: X坐标
        description: 传感器测点X坐标。
      - name: point_y
        sql: "{CUBE}.`pointY`"
        type: number
        title: Y坐标
        description: 传感器测点Y坐标。
      - name: number
        sql: "{CUBE}.`number`"
        type: string
        title: 编号
        description: 传感器配置编号。
      - name: is_used
        sql: "{CUBE}.`isUsed`"
        type: boolean
        title: 功能是否启用
        description: 传感器功能逻辑的启用状态，不表示记录是否删除。
      - name: hourly_average
        sql: "{CUBE}.`avgHour`"
        type: string
        title: 最新小时平均值
        description: 数据库以文本保存的最新小时平均值。
      - name: daily_average
        sql: "{CUBE}.`avgDay`"
        type: string
        title: 最新日平均值
        description: 数据库以文本保存的最新日平均值。
      - name: monthly_average
        sql: "{CUBE}.`avgMonth`"
        type: string
        title: 最新月平均值
        description: 数据库以文本保存的最新月平均值。
      - name: hourly_average_unit
        sql: "{CUBE}.`unitHour`"
        type: string
        title: 小时平均单位
        description: 小时平均值的计量单位。
      - name: daily_average_unit
        sql: "{CUBE}.`unitDay`"
        type: string
        title: 日平均单位
        description: 日平均值的计量单位。
      - name: monthly_average_unit
        sql: "{CUBE}.`unitMonth`"
        type: string
        title: 月平均单位
        description: 月平均值的计量单位。
      - name: maximum_consecutive_mutation_count
        sql: "{CUBE}.`dataNumber`"
        type: string
        title: 突变值最大连续次数
        description: 数据库以文本保存的突变值最大连续次数。
      - name: median_value
        sql: "{CUBE}.`midValue`"
        type: string
        title: 数据中位数
        description: 数据库以文本保存的数据中位数。
      - name: judgment_model_name
        sql: "{CUBE}.`judgmentName`"
        type: string
        title: 判识模型名称
        description: 传感器使用的判识模型名称。
      - name: numeric_id
        sql: "{CUBE}.`intId`"
        type: number
        title: 数字ID
        description: 传感器记录的数字标识。
      - name: monitoring_point_id
        sql: "{CUBE}.`pointId`"
        type: number
        title: 监测点ID
        description: 传感器关联的监测点数字标识。
      - name: query_subject
        sql: "{CUBE}.`selectForm`"
        type: string
        title: 查询主体
        description: 数据源查询配置中的查询主体。
      - name: query_result
        sql: "{CUBE}.`selectResult`"
        type: string
        title: 查询内容
        description: 数据源查询配置中的查询内容。
      - name: query_condition
        sql: "{CUBE}.`selectWhere`"
        type: string
        title: 查询条件
        description: 数据源查询配置中的条件表达式。
      - name: query_order
        sql: "{CUBE}.`selectOrder`"
        type: string
        title: 排序条件
        description: 数据源查询配置中的排序表达式。
      - name: daily_reset_enabled
        sql: "{CUBE}.`isDailyZero`"
        type: boolean
        title: 是否每日清零
        description: 传感器数据是否配置为每日清零。
      - name: is_virtual
        sql: "{CUBE}.`isVirtual`"
        type: string
        title: 是否虚拟传感器
        description: 数据库以文本保存的虚拟传感器标识。
      - name: sensor_labels
        sql: "{CUBE}.`labels`"
        type: string
        title: 传感器标签
        description: 传感器记录保存的标签原始文本。
      - name: judgment_value_type
        sql: "{CUBE}.`judgValueType`"
        type: string
        title: 判识值类型
        description: 判识值类型，sensor表示传感器值，addValue表示增值。
    segments:
      - name: enabled
        sql: "{CUBE}.isEnable = 1"
        title: 已启用传感器
        description: 仅保留已启用的传感器。
      - name: warnings_enabled
        sql: "{CUBE}.isOpenWarn = 1"
        title: 已开启预警
        description: 仅保留已开启预警功能的传感器。
      - name: single_factor_sensors
        sql: "{CUBE}.isSingle = 1"
        title: 单因素传感器
        description: 仅保留配置为单因素预警来源的传感器。
